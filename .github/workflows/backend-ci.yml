name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ci_runner_mode:
        description: Validation runner selection
        type: choice
        default: auto
        options: [auto, self-hosted, github-hosted]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  route:
    name: Select shared CI pool
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.route.outputs.mode }}
      runner: ${{ steps.route.outputs.runner }}
      gate_runner: ${{ steps.route.outputs.gate_runner }}
      shard_runner: ${{ steps.route.outputs.shard_runner }}
    steps:
      - id: route
        uses: ttk9995/peiwan/.github/actions/ci-pool@b3bec8c44ddfd3fa2e0b2d560ba8a24335b0ba12
        with:
          mode: ${{ vars.CI_ROUTER_HOST != '' && (inputs.ci_runner_mode || 'auto') || 'github-hosted' }}
          host: ${{ vars.CI_ROUTER_HOST || '127.0.0.1' }}
          port: ${{ vars.CI_ROUTER_PORT || '22' }}
          user: ${{ vars.CI_ROUTER_USER || 'ci-router' }}
          ssh-key: ${{ secrets.CI_ROUTER_SSH_KEY }}
          known-hosts: ${{ secrets.CI_ROUTER_KNOWN_HOSTS }}
          token: ${{ github.token }}

  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  test:
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.shard_runner) }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Check Docker Compose simple mode environment
        run: /bin/sh deploy/tests/docker-compose-simple-mode-env-test.sh
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: false
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        run: make test-integration

  frontend:
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.shard_runner) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical vitest
        run: make test-frontend

  golangci-lint:
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.gate_runner) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: false
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          args: --timeout=30m
          working-directory: backend

  release-helpers:
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.gate_runner) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/release-tools/requirements-release.txt
      - run: python -m unittest discover -s .github/release-tools -p 'test_release_matrix.py'
      - run: bash -n .github/release-tools/release-images.sh

  release-ci-pool:
    name: Release shared CI capacity
    if: ${{ always() && needs.route.outputs.mode == 'self-hosted' }}
    needs: [route, shell, test, frontend, golangci-lint, release-helpers]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: ttk9995/peiwan/.github/actions/ci-pool@b3bec8c44ddfd3fa2e0b2d560ba8a24335b0ba12
        with:
          action: release
          host: ${{ vars.CI_ROUTER_HOST }}
          port: ${{ vars.CI_ROUTER_PORT || '22' }}
          user: ${{ vars.CI_ROUTER_USER || 'ci-router' }}
          ssh-key: ${{ secrets.CI_ROUTER_SSH_KEY }}
          known-hosts: ${{ secrets.CI_ROUTER_KNOWN_HOSTS }}
          token: ${{ github.token }}
