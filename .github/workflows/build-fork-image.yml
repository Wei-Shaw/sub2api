name: build-fork-image

# 仅用于本 fork：把功能分支构建成 linux/amd64 镜像推到 GHCR，
# 供服务器 `docker compose pull` 使用。不参与上游发布流程。
on:
  push:
    branches:
      - feat/keys-bulk-reset-quota
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: build-fork-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare metadata
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=0.2.20+resetquota
            COMMIT=${{ steps.meta.outputs.sha_short }}
            DATE=${{ steps.meta.outputs.date }}
          tags: |
            ${{ steps.meta.outputs.image }}:feat-reset-quota
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.sha_short }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### 镜像已推送"
            echo ""
            echo "- \`${{ steps.meta.outputs.image }}:feat-reset-quota\`"
            echo "- \`${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.sha_short }}\`"
            echo "- base commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
