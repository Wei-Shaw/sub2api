name: Deploy binary to VPS

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy'
        required: false
        default: 'main'
        type: string
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

env:
  GO_VERSION: '1.27.0'
  PNPM_VERSION: '11.20.0'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      project_version: ${{ steps.project-version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Read project version
        id: project-version
        run: echo "value=$(tr -d '\r\n' < version.txt)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Build Linux binary
        working-directory: backend
        env:
          VERSION: ${{ github.ref_name }}-${{ github.sha }}
        run: |
          mkdir -p ../release
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -tags embed -trimpath -ldflags="-s -w -X main.Version=${VERSION}" \
            -o ../release/sub2api ./cmd/server
          cp ../deploy/config.example.yaml ../release/config.example.yaml
          tar -C ../release -czf ../sub2api-release.tar.gz sub2api config.example.yaml

      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: sub2api-release
          path: sub2api-release.tar.gz
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout commit metadata
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download release package
        uses: actions/download-artifact@v8
        with:
          name: sub2api-release
          path: .

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT || 22 }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload package
        env:
          PACKAGE: sub2api-release.tar.gz
        run: |
          scp -P "${{ secrets.DEPLOY_PORT || 22 }}" \
            "$PACKAGE" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/"

      - name: Install package and restart service
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          PACKAGE: sub2api-release.tar.gz
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "PACKAGE='$PACKAGE' bash -s" <<'REMOTE'
          set -euo pipefail
          base=/opt/sub2api
          release="$base/releases/$PACKAGE"
          mkdir -p "$base/releases"
          mkdir -p "$release"
          tar -xzf "/tmp/$PACKAGE" -C "$release"
          chmod 755 "$release/sub2api"
          ln -sfnT "$release" "$base/current"
          if systemctl is-enabled --quiet sub2api 2>/dev/null; then
            if [ "$(id -u)" -eq 0 ]; then
              systemctl restart sub2api
              systemctl is-active --quiet sub2api
            else
              sudo systemctl restart sub2api
              sudo systemctl is-active --quiet sub2api
            fi
          else
            echo 'sub2api.service is not installed; package uploaded but service was not restarted.'
          fi
          rm -f "/tmp/$PACKAGE"
          REMOTE

      - name: Send Feishu deployment notification
        if: ${{ always() }}
        continue-on-error: true
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          PROJECT_VERSION: ${{ needs.build.outputs.project_version }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
          COMMIT_AUTHOR: ${{ github.actor }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.sha }}
          DEPLOY_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOY_STATUS: ${{ job.status }}
        run: |
          if [ -z "$FEISHU_WEBHOOK_URL" ]; then
            echo 'FEISHU_WEBHOOK_URL is not configured, skipping notification'
            exit 0
          fi
          COMMIT_SUMMARY=$(printf '%s' "$COMMIT_MESSAGE" | head -n 1 | cut -c 1-200)
          if [ "$DEPLOY_STATUS" = "success" ]; then
            TITLE='Sub2API 部署完成'
          else
            TITLE='Sub2API 部署失败'
          fi
          MESSAGE=$(printf '%s\n版本号: %s\n分支: %s\n提交人: %s\n提交摘要: %s\n部署链接: %s' \
            "$TITLE" "$PROJECT_VERSION" "$DEPLOY_BRANCH" "$COMMIT_AUTHOR" "$COMMIT_SUMMARY" "$DEPLOY_URL")
          printf '%s' "$MESSAGE" > "$RUNNER_TEMP/feishu-message.txt"
          jq -n --rawfile text "$RUNNER_TEMP/feishu-message.txt" \
            '{msg_type: "text", content: {text: $text}}' \
            | curl --fail-with-body -sS -X POST "$FEISHU_WEBHOOK_URL" \
                -H 'Content-Type: application/json' -d @-
