name: Publish Docker Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to publish (for example: v0.1.200)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push linux/amd64 image
    runs-on: ubuntu-latest
    environment:
      name: sub2api-deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate image tag
        id: image
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "image_tag must be a valid Docker tag (up to 128 characters)." >&2
            exit 1
          fi

          APP_VERSION="${IMAGE_TAG#v}"
          if [ -z "$APP_VERSION" ]; then
            echo "image_tag must contain a version after an optional v prefix." >&2
            exit 1
          fi

          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker Hub credentials
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Missing DOCKERHUB_USERNAME or DOCKERHUB_TOKEN in the sub2api-deploy environment secrets." >&2
            exit 1
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/sub2api
          tags: |
            type=raw,value=${{ steps.image.outputs.image_tag }}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ steps.image.outputs.app_version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=sub2api-linux-amd64
          cache-to: type=gha,mode=max,scope=sub2api-linux-amd64
