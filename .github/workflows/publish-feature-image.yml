name: Publish feature image

on:
  push:
    branches:
      - feat/custom-models-dev-registry

permissions:
  contents: read
  packages: write

env:
  APP_SHA: fb6986888d0ddb34335ea0addf09a4b39332c273
  IMAGE: ghcr.io/ktkongtong/sub2api
  TAG: 0.2.14-support-custom-models-dev-registry

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.APP_SHA }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: |
            VERSION=0.2.14-support-custom-models-dev-registry
            COMMIT=${{ env.APP_SHA }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
