name: Release Preflight

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: release-candidate-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  MIGRATION_BASELINE_COMMIT: 0572569c6e0187fd02655bec2d9439e30d9edc04
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  candidate:
    name: Detect Release Candidate
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.candidate.outputs.required }}
      version: ${{ steps.candidate.outputs.version }}
    steps:
      - name: Verify workflow identity for Build Once
        if: github.event_name == 'push'
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          [[ "$WORKFLOW_SHA" == "$TARGET_SHA" ]] || {
            echo "Release Preflight workflow was loaded from $WORKFLOW_SHA, expected candidate commit $TARGET_SHA" >&2
            exit 1
          }

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_SHA }}

      - name: Detect unpublished fork version
        id: candidate
        run: |
          VERSION=$(tr -d '\r\n' < backend/cmd/server/VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-ts\.[1-9][0-9]*$ ]]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "Upstream baseline $VERSION does not require fork release preflight"
          elif git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "v${VERSION} is already tagged; no unpublished candidate is active"
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "v${VERSION} is unpublished; full release preflight is required"
          fi

  release-contracts:
    name: Release Contracts
    needs: candidate
    if: needs.candidate.outputs.required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_SHA }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum

      - name: Validate candidate, migrations, and repository contracts
        run: |
          RELEASE_TAG="v${{ needs.candidate.outputs.version }}"
          bash .github/scripts/validate-release-candidate.sh
          backend/scripts/check-release-migrations-history.sh \
            "$MIGRATION_BASELINE_COMMIT" \
            "$TARGET_SHA" \
            "$RELEASE_TAG"
          bash .github/scripts/test-release-candidate.sh
          bash .github/scripts/test-pretag-release-gate.sh
          bash .github/scripts/test-release-safety.sh
          backend/scripts/check-release-migrations-test.sh
          deploy/tests/managed-update-assets-test.sh
          deploy/tests/release-candidate-test.sh

      - name: Verify Go module graph is already tidy
        working-directory: backend
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Exercise the activator with real systemd
        run: |
          for release in 1 2 3 4; do
            commit=$(printf '%040d' "$release")
            go build -trimpath \
              -ldflags="-s -w -X main.Version=0.1.168-ts.$release -X main.Commit=$commit -X main.Date=2026-07-30T00:00:00Z -X main.BuildType=release" \
              -o "$RUNNER_TEMP/sub2api-deployer-systemd-test-$release" \
              ./cmd/deployer
          done
          sudo env SUB2API_SYSTEMD_TEST_EPHEMERAL=1 \
            ../deploy/tests/systemd-control-plane-activation-test.sh \
            "$RUNNER_TEMP/sub2api-deployer-systemd-test-1" \
            "$RUNNER_TEMP/sub2api-deployer-systemd-test-2" \
            "$RUNNER_TEMP/sub2api-deployer-systemd-test-3" \
            "$RUNNER_TEMP/sub2api-deployer-systemd-test-4"
        working-directory: backend

  frontend-release:
    name: Frontend Release Suite
    needs: candidate
    if: needs.candidate.outputs.required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_SHA }}

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Full frontend release preflight
        run: make test-frontend-release

      - name: Upload exact frontend build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist-${{ env.TARGET_SHA }}
          path: backend/internal/web/dist/
          if-no-files-found: error
          retention-days: 30

  build-candidate:
    name: Build Once Candidate
    needs: [candidate, release-contracts, frontend-release]
    if: github.event_name == 'push' && needs.candidate.outputs.required == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_SHA }}

      - name: Set candidate identity
        id: identity
        env:
          VERSION: ${{ needs.candidate.outputs.version }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          OWNER=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          IMAGE_REPOSITORY="ghcr.io/${OWNER}/${REPOSITORY_NAME}"
          echo "image_repository=$IMAGE_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "owner_lower=$OWNER" >> "$GITHUB_OUTPUT"
          echo "candidate_image=${IMAGE_REPOSITORY}:candidate-${TARGET_SHA}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=release-candidate-${TARGET_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Reuse an already finalized candidate artifact for this commit
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ steps.identity.outputs.artifact_name }}
          CANDIDATE_IMAGE: ${{ steps.identity.outputs.candidate_image }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/candidate"
          REUSE_RUN_ID=""
          REUSE_ARTIFACT_ID=""
          mapfile -t RUN_IDS < <(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release-preflight.yml/runs" \
            -f event=push -f head_sha="$TARGET_SHA" -f per_page=20 \
            --jq '.workflow_runs[].id')
          for run_id in "${RUN_IDS[@]}"; do
            artifact_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" | \
              jq -r --arg name "$ARTIFACT_NAME" \
                '.artifacts[] | select(.name == $name and .expired == false) | .id' | head -n 1)
            if [[ -n "$artifact_id" ]]; then
              REUSE_RUN_ID=$run_id
              REUSE_ARTIFACT_ID=$artifact_id
              break
            fi
          done
          if [[ -z "$REUSE_RUN_ID" ]]; then
            echo "reused=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${REUSE_ARTIFACT_ID}/zip" \
            > "$RUNNER_TEMP/candidate-artifact.zip"
          unzip -q "$RUNNER_TEMP/candidate-artifact.zip" -d "$RUNNER_TEMP/candidate"
          rm -f -- "$RUNNER_TEMP/candidate-artifact.zip"
          deploy/verify-release-candidate.sh "$RUNNER_TEMP/candidate" "$VERSION" "$TARGET_SHA"
          jq -e --arg image "$CANDIDATE_IMAGE" '.candidate_image == $image' \
            "$RUNNER_TEMP/candidate/candidate.json" >/dev/null
          echo "Reusing finalized candidate bytes from workflow run $REUSE_RUN_ID"
          echo "reused=true" >> "$GITHUB_OUTPUT"
          echo "source_run_id=$REUSE_RUN_ID" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum

      - name: Download exact frontend build
        if: steps.reuse.outputs.reused != 'true'
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist-${{ env.TARGET_SHA }}
          path: backend/internal/web/dist/

      - name: Build all binaries and archives exactly once
        if: steps.reuse.outputs.reused != 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.17.0
          args: release --snapshot --clean --skip=publish --skip=docker
        env:
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
          GORELEASER_PREVIOUS_TAG: v0.1.166-ts.4
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_OWNER_LOWER: ${{ steps.identity.outputs.owner_lower }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          DOCKERHUB_USERNAME: skip
          CONTROL_PLANE_MANIFEST_SHA256: pending
          TAG_MESSAGE: candidate

      - name: Prepare candidate assets and OCI context
        if: steps.reuse.outputs.reused != 'true'
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          IMAGE_REPOSITORY: ${{ steps.identity.outputs.image_repository }}
        run: |
          deploy/prepare-release-candidate.sh \
            dist/artifacts.json \
            "$RUNNER_TEMP/candidate" \
            "$VERSION" \
            "$TARGET_SHA" \
            "$IMAGE_REPOSITORY"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build once and push candidate content by digest
        if: steps.reuse.outputs.reused != 'true'
        env:
          CANDIDATE_IMAGE: ${{ steps.identity.outputs.candidate_image }}
          IMAGE_REPOSITORY: ${{ steps.identity.outputs.image_repository }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          CONTROL_SHA="sha256:$(sha256sum "$RUNNER_TEMP/candidate/CONTROL-PLANE-MANIFEST.json" | awk '{print $1}')"
          docker buildx build \
            --file Dockerfile.goreleaser \
            --platform linux/amd64,linux/arm64 \
            --provenance=false \
            --sbom=false \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$TARGET_SHA" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "io.tokensupply.sub2api.update-protocol=2" \
            --label "io.tokensupply.sub2api.control-plane-protocol=1" \
            --label "io.tokensupply.sub2api.control-plane-manifest-sha256=$CONTROL_SHA" \
            --output "type=image,name=${IMAGE_REPOSITORY},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "$RUNNER_TEMP/candidate-buildx-metadata.json" \
            "$RUNNER_TEMP/candidate/oci-context"
          IMAGE_DIGEST=$(jq -er '."containerimage.digest" | select(type == "string" and test("^sha256:[0-9a-f]{64}$"))' \
            "$RUNNER_TEMP/candidate-buildx-metadata.json")
          deploy/finalize-release-candidate.sh "$RUNNER_TEMP/candidate" "$IMAGE_DIGEST"

      - name: Verify exact candidate artifact and OCI payload
        env:
          CANDIDATE_IMAGE: ${{ steps.identity.outputs.candidate_image }}
          IMAGE_REPOSITORY: ${{ steps.identity.outputs.image_repository }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          deploy/verify-release-candidate.sh "$RUNNER_TEMP/candidate" "$VERSION" "$TARGET_SHA"
          IMAGE_DIGEST=$(jq -er '.image_digest' "$RUNNER_TEMP/candidate/candidate.json")
          docker buildx imagetools inspect "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" --format '{{json .}}' \
            > "$RUNNER_TEMP/candidate-image.json"
          jq -e --arg digest "$IMAGE_DIGEST" '.manifest.digest == $digest' \
            "$RUNNER_TEMP/candidate-image.json" >/dev/null
          deploy/verify-control-plane-image.sh \
            "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" \
            "$RUNNER_TEMP/candidate" \
            deploy/sub2api-deployer.example.json

      - name: Exercise versioned staging against the real Docker daemon
        env:
          SUB2API_CONTROL_PLANE_TEST_VERSION: ${{ steps.identity.outputs.version }}
          SUB2API_CONTROL_PLANE_TEST_COMMIT: ${{ env.TARGET_SHA }}
        run: |
          IMAGE_DIGEST=$(jq -er '.image_digest' "$RUNNER_TEMP/candidate/candidate.json")
          export SUB2API_CONTROL_PLANE_TEST_IMAGE="${{ steps.identity.outputs.image_repository }}@${IMAGE_DIGEST}"
          go test -tags integration ./internal/deployer -run '^TestRealDockerControlPlaneStaging$' -count=1
        working-directory: backend

      - name: Upload audited Build Once candidate
        if: steps.reuse.outputs.source_run_id != github.run_id
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 30

      - name: Create or verify immutable candidate tag
        env:
          CANDIDATE_IMAGE: ${{ steps.identity.outputs.candidate_image }}
          IMAGE_REPOSITORY: ${{ steps.identity.outputs.image_repository }}
        run: |
          IMAGE_DIGEST=$(jq -er '.image_digest' "$RUNNER_TEMP/candidate/candidate.json")
          EXISTING=$(bash .github/scripts/release-safety.sh image-tag-digest-or-missing "$CANDIDATE_IMAGE")
          if [[ "$EXISTING" == missing ]]; then
            bash .github/scripts/release-safety.sh promote-image-tags \
              "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" "$IMAGE_DIGEST" "$CANDIDATE_IMAGE"
          else
            bash .github/scripts/release-safety.sh assert-image-digest-matches \
              "$CANDIDATE_IMAGE" "$IMAGE_DIGEST"
          fi

  preflight:
    name: Release Preflight
    if: always()
    needs: [candidate, release-contracts, frontend-release, build-candidate]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce candidate preflight result
        env:
          EVENT_NAME: ${{ github.event_name }}
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          PREFLIGHT_REQUIRED: ${{ needs.candidate.outputs.required }}
          CONTRACTS_RESULT: ${{ needs.release-contracts.result }}
          FRONTEND_RESULT: ${{ needs.frontend-release.result }}
          BUILD_RESULT: ${{ needs.build-candidate.result }}
        run: |
          [[ "$CANDIDATE_RESULT" == success ]] || { echo "Candidate detection failed: $CANDIDATE_RESULT" >&2; exit 1; }
          if [[ "$PREFLIGHT_REQUIRED" == true ]]; then
            [[ "$CONTRACTS_RESULT" == success ]] || { echo "Release contracts failed: $CONTRACTS_RESULT" >&2; exit 1; }
            [[ "$FRONTEND_RESULT" == success ]] || { echo "Frontend release suite failed: $FRONTEND_RESULT" >&2; exit 1; }
            if [[ "$EVENT_NAME" == push ]]; then
              [[ "$BUILD_RESULT" == success ]] || { echo "Build Once candidate failed: $BUILD_RESULT" >&2; exit 1; }
            fi
          fi
          echo "Release preflight passed for $TARGET_SHA"
