name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Fork tag to publish
        required: true
        type: string
      candidate_run_id:
        description: Successful pre-tag Release Preflight run containing the audited candidate
        required: true
        type: string
      candidate_commit:
        description: Exact audited commit used to name and validate the candidate artifact
        required: true
        type: string

env:
  MIGRATION_BASELINE_COMMIT: 0572569c6e0187fd02655bec2d9439e30d9edc04
  MIGRATION_BOOTSTRAP_RELEASE_TAG: v0.1.164-ts.1
  RELEASE_BOOTSTRAP_GHCR_DIGEST: sha256:0bcc87a178132539f24570c1af1adbcafd479c7f16a4f3f188fcf09d699c960e
  RELEASE_BOOTSTRAP_DOCKERHUB_DIGEST: ${{ vars.RELEASE_BOOTSTRAP_DOCKERHUB_DIGEST }}
  RELEASE_COMPLETION_ASSET: sub2api-release-complete.json

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      release_commit: ${{ steps.release_ref.outputs.commit }}
      release_tag_object: ${{ steps.release_ref.outputs.tag_object }}
      previous_release_tag: ${{ steps.release_ref.outputs.previous_tag }}
      previous_release_commit: ${{ steps.release_ref.outputs.previous_commit }}
      previous_release_tag_object: ${{ steps.release_ref.outputs.previous_tag_object }}
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Download exact pre-tag candidate
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
          name: release-candidate-${{ inputs.candidate_commit }}
          path: ${{ runner.temp }}/candidate/

      - name: Validate release identity and candidate provenance
        id: release_ref
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TAG_RULESET_ID: ${{ vars.RELEASE_TAG_RULESET_ID }}
          RELEASE_TAG_CREATION_RULESET_ID: ${{ vars.RELEASE_TAG_CREATION_RULESET_ID }}
          INPUT_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          bash .github/scripts/release-safety.sh fetch origin main
          [[ "$RELEASE_TAG_RULESET_ID" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid immutable tag ruleset ID" >&2; exit 1; }
          [[ "$RELEASE_TAG_CREATION_RULESET_ID" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid tag creation ruleset ID" >&2; exit 1; }
          gh api "repos/${GITHUB_REPOSITORY}/rulesets/${RELEASE_TAG_RULESET_ID}" > "$RUNNER_TEMP/immutable-ruleset.json"
          gh api "repos/${GITHUB_REPOSITORY}/rulesets/${RELEASE_TAG_CREATION_RULESET_ID}" > "$RUNNER_TEMP/creation-ruleset.json"
          bash .github/scripts/release-safety.sh verify-rulesets-runtime-json \
            "$RUNNER_TEMP/immutable-ruleset.json" "$RUNNER_TEMP/creation-ruleset.json"
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          bash .github/scripts/release-safety.sh assert-not-published-json "$RELEASE_TAG" "$RUNNER_TEMP/releases.json"
          PREVIOUS_RELEASE_TAG=$(bash .github/scripts/release-safety.sh previous-release-json \
            "$RELEASE_TAG" "$RUNNER_TEMP/releases.json" "$MIGRATION_BOOTSTRAP_RELEASE_TAG")
          RELEASE_METADATA=$(bash .github/scripts/release-safety.sh validate \
            "$RELEASE_TAG" "$PREVIOUS_RELEASE_TAG" refs/remotes/origin/main)
          IFS=$'\t' read -r RELEASE_COMMIT RELEASE_TAG_OBJECT PREVIOUS_RELEASE_TAG \
            PREVIOUS_RELEASE_COMMIT PREVIOUS_RELEASE_TAG_OBJECT <<<"$RELEASE_METADATA"
          [[ "$RELEASE_COMMIT" == "$INPUT_CANDIDATE_COMMIT" ]] || {
            echo "Release tag does not point at the audited candidate commit" >&2
            exit 1
          }
          VERSION=${RELEASE_TAG#v}
          bash .github/scripts/release-safety.sh verify-version-file "$RELEASE_TAG" backend/cmd/server/VERSION
          deploy/verify-release-candidate.sh "$RUNNER_TEMP/candidate" "$VERSION" "$RELEASE_COMMIT"
          jq -e --arg image "ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION" '.image == $image' \
            "$RUNNER_TEMP/candidate/candidate.json" >/dev/null || {
              echo "Candidate targets a different final image repository" >&2
              exit 1
            }
          backend/scripts/check-release-migrations-history.sh \
            "$MIGRATION_BASELINE_COMMIT" "$RELEASE_COMMIT" "$RELEASE_TAG"
          printf 'commit=%s\n' "$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
          printf 'tag_object=%s\n' "$RELEASE_TAG_OBJECT" >> "$GITHUB_OUTPUT"
          printf 'previous_tag=%s\n' "$PREVIOUS_RELEASE_TAG" >> "$GITHUB_OUTPUT"
          printf 'previous_commit=%s\n' "$PREVIOUS_RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
          printf 'previous_tag_object=%s\n' "$PREVIOUS_RELEASE_TAG_OBJECT" >> "$GITHUB_OUTPUT"

  publish:
    needs: release-gate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.release-gate.outputs.release_commit }}

      - name: Download exact pre-tag candidate
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
          name: release-candidate-${{ needs.release-gate.outputs.release_commit }}
          path: ${{ runner.temp }}/candidate/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Load immutable release notes
        id: release_notes
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TAG_OBJECT: ${{ needs.release-gate.outputs.release_tag_object }}
        run: |
          bash .github/scripts/release-safety.sh write-notes-output \
            "$RELEASE_TAG" "$RELEASE_TAG_OBJECT" docs/releases "$GITHUB_OUTPUT"

      - name: Final no-rebuild release preflight
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ needs.release-gate.outputs.release_commit }}
          RELEASE_TAG_OBJECT: ${{ needs.release-gate.outputs.release_tag_object }}
          PREVIOUS_RELEASE_TAG: ${{ needs.release-gate.outputs.previous_release_tag }}
          PREVIOUS_RELEASE_COMMIT: ${{ needs.release-gate.outputs.previous_release_commit }}
          PREVIOUS_RELEASE_TAG_OBJECT: ${{ needs.release-gate.outputs.previous_release_tag_object }}
        run: |
          bash .github/scripts/release-safety.sh fetch origin main
          bash .github/scripts/release-safety.sh verify-tag \
            "$RELEASE_TAG" "$RELEASE_COMMIT" "$RELEASE_TAG_OBJECT" \
            "$PREVIOUS_RELEASE_TAG" "$PREVIOUS_RELEASE_COMMIT" "$PREVIOUS_RELEASE_TAG_OBJECT" \
            refs/remotes/origin/main
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$RUNNER_TEMP/releases-final.json"
          bash .github/scripts/release-safety.sh assert-not-published-json \
            "$RELEASE_TAG" "$RUNNER_TEMP/releases-final.json"
          CURRENT_PREVIOUS=$(bash .github/scripts/release-safety.sh previous-release-json \
            "$RELEASE_TAG" "$RUNNER_TEMP/releases-final.json" "$MIGRATION_BOOTSTRAP_RELEASE_TAG")
          [[ "$CURRENT_PREVIOUS" == "$PREVIOUS_RELEASE_TAG" ]] || {
            echo "Previous completed release changed after validation" >&2
            exit 1
          }
          VERSION=${RELEASE_TAG#v}
          deploy/verify-release-candidate.sh "$RUNNER_TEMP/candidate" "$VERSION" "$RELEASE_COMMIT"
          CANDIDATE_IMAGE=$(jq -er '.candidate_image' "$RUNNER_TEMP/candidate/candidate.json")
          CANDIDATE_DIGEST=$(jq -er '.image_digest' "$RUNNER_TEMP/candidate/candidate.json")
          bash .github/scripts/release-safety.sh assert-image-digest-matches \
            "$CANDIDATE_IMAGE" "$CANDIDATE_DIGEST"
          CANDIDATE_REPOSITORY=${CANDIDATE_IMAGE%:*}
          deploy/verify-control-plane-image.sh \
            "${CANDIDATE_REPOSITORY}@${CANDIDATE_DIGEST}" \
            "$RUNNER_TEMP/candidate" \
            deploy/sub2api-deployer.example.json

      - name: Resolve previous completed release and latest rollback points
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_RELEASE_TAG: ${{ needs.release-gate.outputs.previous_release_tag }}
          PREVIOUS_RELEASE_COMMIT: ${{ needs.release-gate.outputs.previous_release_commit }}
          PREVIOUS_RELEASE_TAG_OBJECT: ${{ needs.release-gate.outputs.previous_release_tag_object }}
        run: |
          GHCR_REPOSITORY="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$PREVIOUS_RELEASE_TAG" == "$MIGRATION_BOOTSTRAP_RELEASE_TAG" ]]; then
            PREVIOUS_GHCR_DIGEST=$RELEASE_BOOTSTRAP_GHCR_DIGEST
            if [[ -n "$DOCKERHUB_USERNAME" ]]; then
              [[ "$RELEASE_BOOTSTRAP_DOCKERHUB_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
                echo "DockerHub bootstrap digest is not configured" >&2
                exit 1
              }
              PREVIOUS_DOCKERHUB_DIGEST=$RELEASE_BOOTSTRAP_DOCKERHUB_DIGEST
            fi
          else
            mkdir -p "$RUNNER_TEMP/previous-release"
            gh release download "$PREVIOUS_RELEASE_TAG" \
              --pattern "$RELEASE_COMPLETION_ASSET" --dir "$RUNNER_TEMP/previous-release"
            gh release download "$PREVIOUS_RELEASE_TAG" \
              --pattern sub2api-deployer-checksums.txt --dir "$RUNNER_TEMP/previous-release"
            PREVIOUS_VERSION=${PREVIOUS_RELEASE_TAG#v}
            PREVIOUS_IMAGE="$GHCR_REPOSITORY:$PREVIOUS_VERSION"
            if [[ -n "$DOCKERHUB_USERNAME" ]]; then
              PREVIOUS_DOCKERHUB_IMAGE="${DOCKERHUB_USERNAME}/sub2api:$PREVIOUS_VERSION"
              bash .github/scripts/release-safety.sh verify-completion-json \
                "$RUNNER_TEMP/previous-release/$RELEASE_COMPLETION_ASSET" \
                "$PREVIOUS_RELEASE_TAG" "$PREVIOUS_RELEASE_COMMIT" "$PREVIOUS_RELEASE_TAG_OBJECT" \
                "$PREVIOUS_IMAGE" "$PREVIOUS_DOCKERHUB_IMAGE"
            else
              bash .github/scripts/release-safety.sh verify-completion-json \
                "$RUNNER_TEMP/previous-release/$RELEASE_COMPLETION_ASSET" \
                "$PREVIOUS_RELEASE_TAG" "$PREVIOUS_RELEASE_COMMIT" "$PREVIOUS_RELEASE_TAG_OBJECT" \
                "$PREVIOUS_IMAGE"
            fi
            bash .github/scripts/release-safety.sh verify-completion-deployer-checksums \
              "$RUNNER_TEMP/previous-release/$RELEASE_COMPLETION_ASSET" \
              "$RUNNER_TEMP/previous-release/sub2api-deployer-checksums.txt"
            PREVIOUS_GHCR_DIGEST=$(jq -er '.image_digest' "$RUNNER_TEMP/previous-release/$RELEASE_COMPLETION_ASSET")
            if [[ -n "$DOCKERHUB_USERNAME" ]]; then
              PREVIOUS_DOCKERHUB_DIGEST=$(jq -er '.dockerhub_image_digest' "$RUNNER_TEMP/previous-release/$RELEASE_COMPLETION_ASSET")
            fi
          fi
          bash .github/scripts/release-safety.sh assert-image-digest-matches \
            "$GHCR_REPOSITORY:latest" "$PREVIOUS_GHCR_DIGEST"
          echo "PREVIOUS_GHCR_DIGEST=$PREVIOUS_GHCR_DIGEST" >> "$GITHUB_ENV"
          if [[ -n "$DOCKERHUB_USERNAME" ]]; then
            bash .github/scripts/release-safety.sh assert-image-digest-matches \
              "${DOCKERHUB_USERNAME}/sub2api:latest" "$PREVIOUS_DOCKERHUB_DIGEST"
            echo "PREVIOUS_DOCKERHUB_DIGEST=$PREVIOUS_DOCKERHUB_DIGEST" >> "$GITHUB_ENV"
          fi

      - name: Promote candidate digest to immutable version tags
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          VERSION=${RELEASE_TAG#v}
          CANDIDATE_IMAGE=$(jq -er '.candidate_image' "$RUNNER_TEMP/candidate/candidate.json")
          IMAGE_DIGEST=$(jq -er '.image_digest' "$RUNNER_TEMP/candidate/candidate.json")
          GHCR_REPOSITORY="ghcr.io/${GITHUB_REPOSITORY,,}"
          GHCR_IMAGE="$GHCR_REPOSITORY:$VERSION"
          EXISTING=$(bash .github/scripts/release-safety.sh image-tag-digest-or-missing "$GHCR_IMAGE")
          if [[ "$EXISTING" == missing ]]; then
            bash .github/scripts/release-safety.sh promote-image-tags \
              "${CANDIDATE_IMAGE}@${IMAGE_DIGEST}" "$IMAGE_DIGEST" "$GHCR_IMAGE"
          else
            bash .github/scripts/release-safety.sh assert-image-digest-matches "$GHCR_IMAGE" "$IMAGE_DIGEST"
          fi
          echo "GHCR_REPOSITORY=$GHCR_REPOSITORY" >> "$GITHUB_ENV"
          echo "GHCR_IMAGE=$GHCR_IMAGE" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_ENV"

          if [[ -n "$DOCKERHUB_USERNAME" ]]; then
            DOCKERHUB_REPOSITORY="${DOCKERHUB_USERNAME}/sub2api"
            DOCKERHUB_IMAGE="$DOCKERHUB_REPOSITORY:$VERSION"
            EXISTING=$(bash .github/scripts/release-safety.sh image-tag-digest-or-missing "$DOCKERHUB_IMAGE")
            if [[ "$EXISTING" == missing ]]; then
              bash .github/scripts/release-safety.sh promote-image-tags \
                "${CANDIDATE_IMAGE}@${IMAGE_DIGEST}" "$IMAGE_DIGEST" "$DOCKERHUB_IMAGE"
            else
              bash .github/scripts/release-safety.sh assert-image-digest-matches "$DOCKERHUB_IMAGE" "$IMAGE_DIGEST"
            fi
            DOCKERHUB_DIGEST=$(bash .github/scripts/release-safety.sh image-tag-digest-or-missing "$DOCKERHUB_IMAGE")
            echo "DOCKERHUB_REPOSITORY=$DOCKERHUB_REPOSITORY" >> "$GITHUB_ENV"
            echo "DOCKERHUB_IMAGE=$DOCKERHUB_IMAGE" >> "$GITHUB_ENV"
            echo "DOCKERHUB_DIGEST=$DOCKERHUB_DIGEST" >> "$GITHUB_ENV"
          fi

      - name: Create or verify draft and upload exact candidate assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_NOTES: ${{ steps.release_notes.outputs.message }}
        run: |
          NOTES_PATH="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' "$RELEASE_NOTES" > "$NOTES_PATH"
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            jq -e '.isDraft == true' "$RUNNER_TEMP/existing-release.json" >/dev/null || {
              echo "Release is already published" >&2
              exit 1
            }
          else
            gh release create "$RELEASE_TAG" --draft --latest=false \
              --title "Sub2API ${RELEASE_TAG#v}" --notes-file "$NOTES_PATH"
          fi
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/candidate/release-assets/"* --clobber

      - name: Bind tag identity and publish completion ledger
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ needs.release-gate.outputs.release_commit }}
          RELEASE_TAG_OBJECT: ${{ needs.release-gate.outputs.release_tag_object }}
        run: |
          CANDIDATE="$RUNNER_TEMP/candidate/candidate.json"
          CANDIDATE_MANIFEST_SHA="sha256:$(sha256sum "$RUNNER_TEMP/candidate/MANIFEST.sha256" | awk '{print $1}')"
          COMPLETION_PATH="$RUNNER_TEMP/$RELEASE_COMPLETION_ASSET"
          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg commit "$RELEASE_COMMIT" \
            --arg tag_object "$RELEASE_TAG_OBJECT" \
            --arg image "$GHCR_IMAGE" \
            --arg image_digest "$IMAGE_DIGEST" \
            --arg dockerhub_image "${DOCKERHUB_IMAGE:-}" \
            --arg dockerhub_digest "${DOCKERHUB_DIGEST:-}" \
            --arg candidate_manifest_sha "$CANDIDATE_MANIFEST_SHA" \
            --slurpfile candidate "$CANDIDATE" '
              ($candidate[0]) as $c | {
                schema: 3,
                tag: $tag,
                commit: $commit,
                tag_object: $tag_object,
                image: $image,
                image_digest: $image_digest,
                immutable_image: ($image + "@" + $image_digest),
                dockerhub_image: (if $dockerhub_image == "" then null else $dockerhub_image end),
                dockerhub_image_digest: (if $dockerhub_digest == "" then null else $dockerhub_digest end),
                dockerhub_immutable_image: (if $dockerhub_image == "" then null else ($dockerhub_image + "@" + $dockerhub_digest) end),
                architectures: $c.architectures,
                control_plane_manifest_sha256: $c.control_plane_manifest_sha256,
                candidate_manifest_sha256: $candidate_manifest_sha,
                deployer_checksums_sha256: $c.deployer_checksums_sha256,
                deployer_assets: $c.deployer_assets
              }
            ' > "$COMPLETION_PATH"
          if [[ -n "$DOCKERHUB_USERNAME" ]]; then
            bash .github/scripts/release-safety.sh verify-completion-json \
              "$COMPLETION_PATH" "$RELEASE_TAG" "$RELEASE_COMMIT" "$RELEASE_TAG_OBJECT" \
              "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"
          else
            bash .github/scripts/release-safety.sh verify-completion-json \
              "$COMPLETION_PATH" "$RELEASE_TAG" "$RELEASE_COMMIT" "$RELEASE_TAG_OBJECT" "$GHCR_IMAGE" ""
          fi
          bash .github/scripts/release-safety.sh verify-completion-candidate \
            "$COMPLETION_PATH" "$RUNNER_TEMP/candidate"
          bash .github/scripts/release-safety.sh verify-completion-deployer-checksums \
            "$COMPLETION_PATH" "$RUNNER_TEMP/candidate/release-assets/sub2api-deployer-checksums.txt"
          gh release upload "$RELEASE_TAG" "$COMPLETION_PATH" --clobber
          gh release view "$RELEASE_TAG" --json isDraft,assets > "$RUNNER_TEMP/draft.json"
          jq -e --arg asset "$RELEASE_COMPLETION_ASSET" '
            .isDraft == true and ([.assets[] | select(.name == $asset)] | length == 1)
          ' "$RUNNER_TEMP/draft.json" >/dev/null

      - name: Publish release and promote latest transactionally
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "$DOCKERHUB_USERNAME" ]]; then
            bash .github/scripts/release-safety.sh publish-release-with-latest \
              "$RELEASE_TAG" "$GHCR_REPOSITORY" "$IMAGE_DIGEST" "$PREVIOUS_GHCR_DIGEST" \
              "$DOCKERHUB_REPOSITORY" "$DOCKERHUB_DIGEST" "$PREVIOUS_DOCKERHUB_DIGEST"
          else
            bash .github/scripts/release-safety.sh publish-release-with-latest \
              "$RELEASE_TAG" "$GHCR_REPOSITORY" "$IMAGE_DIGEST" "$PREVIOUS_GHCR_DIGEST"
          fi
          gh release view "$RELEASE_TAG" --json isDraft,assets > "$RUNNER_TEMP/published.json"
          jq -e --arg asset "$RELEASE_COMPLETION_ASSET" '
            .isDraft == false and ([.assets[] | select(.name == $asset)] | length == 1)
          ' "$RUNNER_TEMP/published.json" >/dev/null

      - name: Update DockerHub description
        if: env.DOCKERHUB_USERNAME != ''
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/sub2api
          short-description: Sub2API - AI API Gateway Platform
          readme-filepath: ./deploy/DOCKER.md
