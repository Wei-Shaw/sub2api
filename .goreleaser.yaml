version: 2

project_name: sub2api

# Pre-tag Build Once uses snapshot mode because GoReleaser otherwise requires
# the selected current tag to exist at HEAD. The validated release version is
# injected explicitly, so snapshot artifacts carry their final identity.
snapshot:
  version_template: '{{ .Env.RELEASE_VERSION }}'

builds:
  - id: sub2api
    dir: backend
    main: ./cmd/server
    binary: sub2api
    flags:
      - -tags=embed
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Commit={{.Commit}}
      - -X main.Date={{.CommitDate}}
      - -X main.BuildType=release
    mod_timestamp: '{{ .CommitTimestamp }}'

  - id: sub2api-deployer
    dir: backend
    main: ./cmd/deployer
    binary: sub2api-deployer
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Commit={{.Commit}}
      - -X main.Date={{.CommitDate}}
      - -X main.BuildType=release
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: default
    ids:
      - sub2api
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE*
      - README*
      - deploy/*

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

changelog:
  # 禁用自动 changelog，完全使用 tag 消息
  disable: true

# GoReleaser publishes only the immutable version tag. The release workflow
# promotes latest after it verifies the completion ledger.
dockers_v2:
  - id: sub2api
    ids:
      - sub2api
      - sub2api-deployer
    images:
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/sub2api"
      - '{{ if ne .Env.DOCKERHUB_USERNAME "skip" }}{{ .Env.DOCKERHUB_USERNAME }}/sub2api{{ end }}'
    tags:
      - "{{ .Version }}"
    dockerfile: Dockerfile.goreleaser
    extra_files:
      - deploy/docker-entrypoint.sh
      - CONTROL-PLANE-MANIFEST.json
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .Commit }}"
      org.opencontainers.image.source: "https://github.com/{{ .Env.GITHUB_REPO_OWNER }}/{{ .Env.GITHUB_REPO_NAME }}"
      io.tokensupply.sub2api.update-protocol: "2"
      io.tokensupply.sub2api.control-plane-protocol: "1"
      io.tokensupply.sub2api.control-plane-manifest-sha256: "{{ .Env.CONTROL_PLANE_MANIFEST_SHA256 }}"

release:
  github:
    owner: "{{ .Env.GITHUB_REPO_OWNER }}"
    name: "{{ .Env.GITHUB_REPO_NAME }}"
  # Keep the release invisible to /releases/latest until the workflow verifies
  # every image and asset and uploads the completion marker.
  draft: true
  # Fork tags use a SemVer prerelease suffix to carry the TokenSupply revision,
  # but GitHub must expose them through /releases/latest for the in-app checker.
  prerelease: false
  make_latest: false
  name_template: "Sub2API {{.Version}}"
  # 完全使用 tag 消息作为 release 内容（通过环境变量传入）
  header: |
    > AI API Gateway Platform - 将 AI 订阅配额分发和管理

    {{ .Env.TAG_MESSAGE }}

  footer: |

    ---

    ## 📥 Installation

    **Docker:**
    ```bash
    {{ if ne .Env.DOCKERHUB_USERNAME "skip" -}}
    # Docker Hub
    docker pull {{ .Env.DOCKERHUB_USERNAME }}/sub2api:{{ .Version }}

    {{ end -}}
    # GitHub Container Registry
    docker pull ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/sub2api:{{ .Version }}
    ```

    **One-line install (Linux):**
    ```bash
    curl -sSL https://raw.githubusercontent.com/{{ .Env.GITHUB_REPO_OWNER }}/{{ .Env.GITHUB_REPO_NAME }}/main/deploy/install.sh | sudo bash
    ```

    **Manual download:**
    Download the appropriate archive for your platform from the assets below.

    ## 📚 Documentation

    - [GitHub Repository](https://github.com/{{ .Env.GITHUB_REPO_OWNER }}/{{ .Env.GITHUB_REPO_NAME }})
    - [Installation Guide](https://github.com/{{ .Env.GITHUB_REPO_OWNER }}/{{ .Env.GITHUB_REPO_NAME }}/blob/main/deploy/README.md)
