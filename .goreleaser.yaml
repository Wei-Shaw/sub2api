version: 2

project_name: sub2api

before:
  hooks:
    - go mod tidy -C backend

builds:
  - id: sub2api
    dir: backend
    main: ./cmd/server
    binary: sub2api
    flags:
      - -tags=embed
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.Commit={{.CommitREDACTEDREDACTED
      - -X main.Date={{.DateREDACTEDREDACTED
      - -X main.BuildType=release

archives:
  - id: default
    format: tar.gz
    name_template: >-
      {{ .ProjectName REDACTEDREDACTED_{{ .Version REDACTEDREDACTED_{{ .Os REDACTEDREDACTED_{{ .Arch REDACTEDREDACTED
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE*
      - README*
      - deploy/*

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

changelog:
  # 禁用自动 changelog，完全使用 tag 消息
  disable: true

# Docker images
dockers:
  # DockerHub images (skipped if DOCKERHUB_USERNAME is 'skip')
  - id: amd64
    goos: linux
    goarch: amd64
    skip_push: '{{ if eq .Env.DOCKERHUB_USERNAME "skip" REDACTEDREDACTEDtrue{{ else REDACTEDREDACTEDfalse{{ end REDACTEDREDACTED'
    image_templates:
      - "{{ .Env.DOCKERHUB_USERNAME REDACTEDREDACTED/sub2api:{{ .Version REDACTEDREDACTED-amd64"
    dockerfile: Dockerfile.goreleaser
    use: buildx
    extra_files:
      - deploy/docker-entrypoint.sh
      - backend/resources
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.version={{ .Version REDACTEDREDACTED"
      - "--label=org.opencontainers.image.revision={{ .Commit REDACTEDREDACTED"

  - id: arm64
    goos: linux
    goarch: arm64
    skip_push: '{{ if eq .Env.DOCKERHUB_USERNAME "skip" REDACTEDREDACTEDtrue{{ else REDACTEDREDACTEDfalse{{ end REDACTEDREDACTED'
    image_templates:
      - "{{ .Env.DOCKERHUB_USERNAME REDACTEDREDACTED/sub2api:{{ .Version REDACTEDREDACTED-arm64"
    dockerfile: Dockerfile.goreleaser
    use: buildx
    extra_files:
      - deploy/docker-entrypoint.sh
      - backend/resources
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.version={{ .Version REDACTEDREDACTED"
      - "--label=org.opencontainers.image.revision={{ .Commit REDACTEDREDACTED"

  # GHCR images (owner must be lowercase)
  - id: ghcr-amd64
    goos: linux
    goarch: amd64
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER REDACTEDREDACTED/sub2api:{{ .Version REDACTEDREDACTED-amd64"
    dockerfile: Dockerfile.goreleaser
    use: buildx
    extra_files:
      - deploy/docker-entrypoint.sh
      - backend/resources
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.version={{ .Version REDACTEDREDACTED"
      - "--label=org.opencontainers.image.revision={{ .Commit REDACTEDREDACTED"
      - "--label=org.opencontainers.image.source=https://github.com/{{ .Env.GITHUB_REPO_OWNER REDACTEDREDACTED/{{ .Env.GITHUB_REPO_NAME REDACTEDREDACTED"

  - id: ghcr-arm64
    goos: linux
    goarch: arm64
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER REDACTEDREDACTED/sub2api:{{ .Version REDACTEDREDACTED-arm64"
    dockerfile: Dockerfile.goreleaser
    use: buildx
    extra_files:
      - deploy/docker-entrypoint.sh
      - backend/resources
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.version={{ .Version REDACTEDREDACTED"
      - "--label=org.opencontainers.image.revision={{ .Commit REDACTEDREDACTED"
      - "--label=org.opencontainers.image.source=https://github.com/{{ .Env.GITHUB_REPO_OWNER REDACTEDREDACTED/{{ .Env.GITHUB_REPO_NAME REDACTEDREDACTED"

# Docker manifests for multi-arch support
docker_manifests:
  # DockerHub manifests (skipped if DOCKERHUB_USERNAME is 'skip')
  - name_template: "{{ .Env.DOCKERHUB_USERNAME REDACTEDREDACTED/sub2api:{{ .Version REDACTEDREDACTED"
    skip_push: '{{ if eq .Env.DOCKERHUB_USERNAME "skip" REDACTEDREDACTEDtrue{{ else REDACTEDREDACTEDfalse{{ end REDACTEDREDACTED'
    image_templates:
      - "{{ .Env.DOCKERHUB_USERNAME REDACTEDREDACTED/sub2api:{{ .Version REDACTEDREDACTED-amd64"
      - "{{ .Env.DOCKERHUB_USERNAME REDACTEDREDACTED/sub2api:{{ .Version REDACTEDREDACTED-arm64"

  - name_template: "{{ .Env.DOCKERHUB_USERNAME REDACTEDREDACTED/sub2api:latest"
    skip_push: '{{ if eq .Env.DOCKERHUB_USERNAME "skip" REDACTEDREDACTEDtrue{{ else REDACTEDREDACTEDfalse{{ end REDACTEDREDACTED'
    image_templates:
      - "{{ .Env.DOCKERHUB_USERNAME REDACTEDREDACTED/sub2api:{{ .Version REDACTEDREDACTED-amd64"
      - "{{ .Env.DOCKERHUB_USERNAME REDACTEDREDACTED/sub2api:{{ .Version REDACTEDREDACTED-arm64"

  - name_template: "{{ .Env.DOCKERHUB_USERNAME REDACTEDREDACTED/sub2api:{{ .Major REDACTEDREDACTED.{{ .Minor REDACTEDREDACTED"
    skip_push: '{{ if eq .Env.DOCKERHUB_USERNAME "skip" REDACTEDREDACTEDtrue{{ else REDACTEDREDACTEDfalse{{ end REDACTEDREDACTED'
    image_templates:
      - "{{ .Env.DOCKERHUB_USERNAME REDACTEDREDACTED/sub2api:{{ .Version REDACTEDREDACTED-amd64"
      - "{{ .Env.DOCKERHUB_USERNAME REDACTEDREDACTED/sub2api:{{ .Version REDACTEDREDACTED-arm64"

  - name_template: "{{ .Env.DOCKERHUB_USERNAME REDACTEDREDACTED/sub2api:{{ .Major REDACTEDREDACTED"
    skip_push: '{{ if eq .Env.DOCKERHUB_USERNAME "skip" REDACTEDREDACTEDtrue{{ else REDACTEDREDACTEDfalse{{ end REDACTEDREDACTED'
    image_templates:
      - "{{ .Env.DOCKERHUB_USERNAME REDACTEDREDACTED/sub2api:{{ .Version REDACTEDREDACTED-amd64"
      - "{{ .Env.DOCKERHUB_USERNAME REDACTEDREDACTED/sub2api:{{ .Version REDACTEDREDACTED-arm64"

  # GHCR manifests (owner must be lowercase)
  - name_template: "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER REDACTEDREDACTED/sub2api:{{ .Version REDACTEDREDACTED"
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER REDACTEDREDACTED/sub2api:{{ .Version REDACTEDREDACTED-amd64"
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER REDACTEDREDACTED/sub2api:{{ .Version REDACTEDREDACTED-arm64"

  - name_template: "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER REDACTEDREDACTED/sub2api:latest"
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER REDACTEDREDACTED/sub2api:{{ .Version REDACTEDREDACTED-amd64"
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER REDACTEDREDACTED/sub2api:{{ .Version REDACTEDREDACTED-arm64"

  - name_template: "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER REDACTEDREDACTED/sub2api:{{ .Major REDACTEDREDACTED.{{ .Minor REDACTEDREDACTED"
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER REDACTEDREDACTED/sub2api:{{ .Version REDACTEDREDACTED-amd64"
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER REDACTEDREDACTED/sub2api:{{ .Version REDACTEDREDACTED-arm64"

  - name_template: "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER REDACTEDREDACTED/sub2api:{{ .Major REDACTEDREDACTED"
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER REDACTEDREDACTED/sub2api:{{ .Version REDACTEDREDACTED-amd64"
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER REDACTEDREDACTED/sub2api:{{ .Version REDACTEDREDACTED-arm64"

release:
  github:
    owner: "{{ .Env.GITHUB_REPO_OWNER REDACTEDREDACTED"
    name: "{{ .Env.GITHUB_REPO_NAME REDACTEDREDACTED"
  draft: false
  prerelease: auto
  name_template: "Sub2API {{.VersionREDACTEDREDACTED"
  # 完全使用 tag 消息作为 release 内容（通过环境变量传入）
  header: |
    > AI API Gateway Platform - 将 AI 订阅配额分发和管理

    {{ .Env.TAG_MESSAGE REDACTEDREDACTED

  footer: |

    ---

    ## 📥 Installation

    **Docker:**
    ```bash
    {{ if ne .Env.DOCKERHUB_USERNAME "skip" -REDACTEDREDACTED
    # Docker Hub
    docker pull {{ .Env.DOCKERHUB_USERNAME REDACTEDREDACTED/sub2api:{{ .Version REDACTEDREDACTED

    {{ end -REDACTEDREDACTED
    # GitHub Container Registry
    docker pull ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER REDACTEDREDACTED/sub2api:{{ .Version REDACTEDREDACTED
    ```

    **One-line install (Linux):**
    ```bash
    curl -sSL https://raw.githubusercontent.com/{{ .Env.GITHUB_REPO_OWNER REDACTEDREDACTED/{{ .Env.GITHUB_REPO_NAME REDACTEDREDACTED/main/deploy/install.sh | sudo bash
    ```

    **Manual download:**
    Download the appropriate archive for your platform from the assets below.

    ## 📚 Documentation

    - [GitHub Repository](https://github.com/{{ .Env.GITHUB_REPO_OWNER REDACTEDREDACTED/{{ .Env.GITHUB_REPO_NAME REDACTEDREDACTED)
    - [Installation Guide](https://github.com/{{ .Env.GITHUB_REPO_OWNER REDACTEDREDACTED/{{ .Env.GITHUB_REPO_NAME REDACTEDREDACTED/blob/main/deploy/README.md)
