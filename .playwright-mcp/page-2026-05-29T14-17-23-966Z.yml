  - region "English summary" [ref=e70]:
    - paragraph [ref=e71]:
      - strong [ref=e72]: "TL;DR (English):"
      - text: TokenProvider is a third-party AI API gateway. Use one OpenAI-compatible Base URL and key to call Claude, Claude Code, ChatGPT, and Gemini. Pay-as-you-go per token; rates and minimum top-up are visible in the dashboard after sign-up. Not affiliated with Anthropic, OpenAI, or Google.
    - heading "Cheap Claude API, Claude Code, ChatGPT & Gemini — one gateway" [level=2] [ref=e73]
    - paragraph [ref=e74]:
      - text: TokenProvider routes your requests to upstream official models through a unified
      - strong [ref=e75]: OpenAI-compatible
      - text: endpoint. Pay only for the tokens you use, see real-time billing in the dashboard, and switch between Claude / Claude Code / ChatGPT / Gemini without juggling multiple subscriptions.
    - heading "Why developers pick TokenProvider" [level=2] [ref=e76]
    - list [ref=e77]:
      - listitem [ref=e78]:
        - strong [ref=e79]: "One key, many models:"
        - text: Claude, Claude Code, ChatGPT, Gemini through a single OpenAI-compatible Base URL.
      - listitem [ref=e80]:
        - strong [ref=e81]: "Pay-as-you-go:"
        - text: Pre-fund a balance; per-request token billing; live rates in the dashboard.
      - listitem [ref=e82]:
        - strong [ref=e83]: "Sticky sessions:"
        - text: Long-context flows (Claude Code, agentic workflows) stay on a consistent upstream account.
      - listitem [ref=e84]:
        - strong [ref=e85]: "Static, citation-friendly docs:"
        - text: Comparisons, guides, and code examples published as plain HTML for easy indexing.
    - heading "FAQ (English)" [level=2] [ref=e86]
    - heading "Is TokenProvider an official Anthropic / OpenAI / Google product?" [level=3] [ref=e87]
    - paragraph [ref=e88]: No. TokenProvider is an independent third-party API gateway. It forwards requests to the official upstream APIs and aggregates billing, routing, and authentication.
    - heading "How does pricing work?" [level=3] [ref=e89]
    - paragraph [ref=e90]: Pre-purchased balance, deducted per request based on input/output tokens reported by the upstream model. The current per-token rate, minimum top-up, and currency are shown in the dashboard after registration.
