# =============================================================================
# Sub2API - Local Development Infrastructure (PostgreSQL + Redis only)
# =============================================================================
# 本地二开专用，仅启动 PG 和 Redis，不包含 sub2api 应用服务。
# 应用在 Windows 宿主机上直接运行，通过 localhost 连接 WSL2 中的服务。
#
# Usage:
#   cd deploy
#   docker compose -f docker-compose.infra.yml up -d
#
# Connect from Windows:
#   PostgreSQL: localhost:5432  user=root  password=123456  db=sub2api
#   Redis:      localhost:6379  password=123456
# =============================================================================

services:
  postgres:
    image: postgres:18-alpine
    container_name: sub2api-infra-postgres
    restart: unless-stopped
    ports:
      - "0.0.0.0:${PG_PORT:-5432}:5432"
    volumes:
      - ./infra_postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=sub2api
      - PGDATA=/var/lib/postgresql/data
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d sub2api"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: sub2api-infra-redis
    restart: unless-stopped
    ports:
      - "0.0.0.0:${REDIS_PORT:-6379}:6379"
    volumes:
      - ./infra_redis_data:/data
    command: >
      redis-server
      --save 60 1
      --appendonly yes
      --appendfsync everysec
      --requirepass 123456
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
