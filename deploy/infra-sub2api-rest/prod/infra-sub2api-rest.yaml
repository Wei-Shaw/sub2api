name: golang_node
description: 云主机部署方式的 Golang 项目

hosts:
  {{ range .Hosts }}{{ .Host }}:
    remote_user: {{ .RemoteUser }}
  {{ end }}

tasks:
  deploy:
    sudo: true
    steps:
      - uses: checkout
        with:
          repository: {{ .Repository }}
          commit: {{ .Commit }}
          tag: {{ .Tag }}
      - name: build
        run: |
          set -euo pipefail

          # 1) 用 Docker 仅构建前端（构建机无 node/pnpm）
          docker build \
            --target frontend-builder \
            --build-arg NODE_IMAGE=hub.p1.cn/cicd/node:24 \
            --build-arg NPM_REGISTRY=https://registry.npmmirror.com \
            -f deploy/infra-sub2api-rest/prod/Dockerfile \
            -t {{ .ServiceName }}-frontend-builder:tmp \
            .

          # 2) 从容器中把前端产物 copy 到后端 embed 目录
          CID=$(docker create {{ .ServiceName }}-frontend-builder:tmp)
          rm -rf backend/internal/web/dist
          docker cp "${CID}:/app/backend/internal/web/dist" backend/internal/web/dist
          docker rm "${CID}"
          docker rmi {{ .ServiceName }}-frontend-builder:tmp || true

          # 3) 本机按原有方式编译后端（嵌入前端）
          # 临时关闭 nounset：~/.bashrc 会 source /etc/bashrc，其中引用了未定义的 PS1
          set +u
          source ~/.bashrc
          set -u
          goup set 1.26.4
          cd backend
          go mod tidy
          make build-embed
          cd ..

          mkdir -p package/{{ .ServiceName }}/{bin,conf}
          cp backend/bin/server package/{{ .ServiceName }}/bin/{{ .ServiceName }}
          cp -R conf/{{ .ServiceName }}/prod/* package/{{ .ServiceName }}/conf/
          chmod +x package/{{ .ServiceName }}/bin/{{ .ServiceName }}

      - uses: setup
      - uses: release
      - uses: upload
        with:
          user: ops
          source: package/{{ .ServiceName }}
          deploy_path: /app/{{ .ServiceName }}
      - uses: symlink
      - uses: cleanup
      - uses: clear-build
      - uses: releases
        with:
          num: 3
      - name: link system service
        run: |
          sudo ln -nfs /app/{{.ServiceName}}/current/conf/{{.ServiceName}}.service /etc/systemd/system/
      - name: daemon-reload
        send_change: true
        with:
          product: infra
          serviceName: {{ .ServiceName }}
          description: "{{ .Description }}"
          operator: {{ .Operator }}
        run: |
          sudo systemctl daemon-reload
          sudo systemctl restart infra-sub2api-rest
          sudo systemctl status infra-sub2api-rest
          while true
          do
            status=$(systemctl is-failed {{.ServiceName}})
            if [ $status == 'active' ]; then
              echo -e "\033[32;1mservice is running\033[0m";
              exit 0;
            elif [ $status == 'failed' ]; then
              echo -e "\033[31;1mservice is start failed\033[0m" >&2;
              exit 1;
            fi
            sleep 2
          done
        runs-on: remote
