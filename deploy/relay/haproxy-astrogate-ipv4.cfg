global
    log /dev/log local0
    maxconn 2048

defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client 1h
    timeout server 1h

frontend tls_in
    bind 0.0.0.0:443
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    use_backend astrogate if { req.ssl_sni -i dicksuck.astrogate.sbs }
    default_backend xray

backend astrogate
    server local_relay 127.0.0.1:8443 check

backend xray
    server local_xray 127.0.0.1:1443
