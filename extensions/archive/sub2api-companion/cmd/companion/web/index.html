<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2212%22 fill=%22%2318212b%22/><path d=%22M17 35h9l5-13 7 25 5-12h6%22 fill=%22none%22 stroke=%22%2320c997%22 stroke-width=%226%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/></svg>">
  <title>经营对账</title>
  <style>
    :root{color-scheme:light;--bg:#f4f6f8;--panel:#fff;--line:#d8dee5;--text:#17202a;--muted:#66717e;--green:#087f5b;--red:#c92a2a;--blue:#1864ab}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif}header{height:56px;background:#18212b;color:#fff;display:flex;align-items:center;padding:0 24px;justify-content:space-between}header h1{font-size:17px;margin:0;letter-spacing:0}main{max-width:1660px;margin:0 auto;padding:20px}.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}.toolbar input,.toolbar button,.toolbar select,.pager button,.pager select{height:34px;border:1px solid var(--line);background:#fff;padding:0 10px}.toolbar button,.pager button{cursor:pointer;color:var(--blue);font-weight:600}.toolbar button:disabled,.pager button:disabled{cursor:not-allowed;color:#9aa3ad;background:#f1f3f5}.quick-ranges{display:flex;gap:6px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.quick-ranges button{height:30px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--blue);padding:0 10px;cursor:pointer}.quick-ranges button.active{background:var(--blue);border-color:var(--blue);color:#fff}.range-summary{color:var(--muted);margin-left:4px}.auto-refresh{display:flex;align-items:center;gap:5px;color:var(--muted);margin-left:4px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:10px;margin-bottom:14px}.metric{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;min-width:0;text-align:left;font:inherit;color:inherit}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{display:block;font-size:22px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.filter-card{cursor:pointer;transition:border-color .15s,box-shadow .15s}.filter-card:hover{border-color:#74a9d8}.filter-card.active{border-color:var(--blue);box-shadow:0 0 0 2px rgba(24,100,171,.14)}.positive{color:var(--green)}.negative{color:var(--red)}.chart-section{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;margin-bottom:14px;padding:12px 14px}.chart-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.chart-title{display:flex;align-items:baseline;gap:8px}.chart-title strong{font-size:14px}.chart-title span{font-size:12px;color:var(--muted)}.chart-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.segmented{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}.segmented button{height:28px;border:0;border-right:1px solid var(--line);background:#fff;color:var(--blue);padding:0 12px;cursor:pointer}.segmented button:last-child{border-right:0}.segmented button.active{background:var(--blue);color:#fff}.chart-legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px}.legend-item{display:flex;align-items:center;gap:5px}.legend-swatch{width:18px;height:3px;border-radius:2px}.chart-wrap{position:relative;width:100%;height:280px;margin-top:8px}.chart-wrap canvas{display:block;width:100%;height:100%}.chart-tooltip{display:none;position:absolute;z-index:2;pointer-events:none;background:#18212b;color:#fff;border-radius:4px;padding:8px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.18);white-space:nowrap}.chart-tooltip strong{display:block;margin-bottom:4px}.chart-tooltip span{display:block}.rules-section{background:var(--panel);border:1px solid var(--line);border-radius:6px;margin-bottom:14px;padding:12px 14px}.rules-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}.rules-head span{color:var(--muted);font-size:12px}.rules-scroll{overflow:auto}.rules-table{min-width:1120px}.rules-table select,.rules-table input,.rules-table button{height:30px;border:1px solid var(--line);background:#fff;padding:0 8px}.rules-table input{width:180px}.rules-table button{cursor:pointer;color:var(--blue);font-weight:600}.rules-table button.danger{color:var(--red)}.group-cell{background:#f8f9fa;vertical-align:top;min-width:190px}.group-cell strong{display:block}.group-cell span,.channel-meta{display:block;color:var(--muted);font-size:12px}.channel-cell{min-width:210px}.table-wrap{background:#fff;border:1px solid var(--line);overflow:auto}table{border-collapse:collapse;width:100%;min-width:1480px}th,td{text-align:left;padding:9px 9px;border-bottom:1px solid #edf0f2;white-space:nowrap}th{position:sticky;top:0;background:#f8f9fa;color:#49525c;font-size:12px}.num{text-align:right;font-variant-numeric:tabular-nums}.truncate{display:block;max-width:178px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.id-button{width:132px;padding:0;border:0;background:transparent;color:var(--blue);cursor:pointer;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:12px ui-monospace,SFMono-Regular,Consolas,monospace}.id-button:hover{text-decoration:underline}.badge{display:inline-block;padding:2px 7px;border-radius:4px;background:#fff3bf;color:#8f5d00}.badge.ok{background:#d3f9d8;color:#087f5b}.badge.rule{background:#e7f5ff;color:#1864ab}.badge.orphan{background:#fff3bf;color:#8f5d00}.empty{text-align:center;color:var(--muted);padding:30px}.pager{min-height:50px;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:8px 0;color:var(--muted);flex-wrap:wrap}.pager button{width:36px;padding:0;font-size:20px;line-height:1}.pager-info{min-width:190px;text-align:center;font-variant-numeric:tabular-nums}@media(max-width:900px){main{padding:12px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}header{padding:0 14px}.pager{justify-content:center}.range-summary{width:100%;margin-left:0}.chart-wrap{height:250px}.chart-controls{width:100%;justify-content:space-between}}@media(max-width:430px){.metric{padding:10px}.metric strong{font-size:18px}.pager-info{width:100%;order:-1}.toolbar label{width:100%}.toolbar input[type=datetime-local]{width:100%}.chart-section{padding:10px}.chart-legend{gap:8px}.chart-wrap{height:230px}}
  </style>
</head>
<body>
<header><h1>经营对账</h1><span id="updated">--</span></header>
<main>
  <div class="toolbar"><label>开始时间 <input id="from" type="datetime-local" step="1"></label><label>结束时间 <input id="to" type="datetime-local" step="1"></label><button id="apply-range">应用</button><button id="refresh">刷新</button><button id="collect">立即同步</button><label class="auto-refresh"><input id="auto-refresh" type="checkbox" checked>自动刷新</label></div>
  <div class="quick-ranges" id="quick-ranges"><button data-range="today">今天</button><button class="active" data-range="24h">24小时</button><button data-range="3d">近3天</button><button data-range="7d">近7天</button><button data-range="month">本月</button><button data-range="last-month">上个月</button><button data-range="3m">近三月</button><button data-range="1y">近一年</button><span id="range-summary" class="range-summary"></span><span id="fx-status" class="range-summary" title="A6 美元成本折算人民币时使用的当前小时汇率快照"></span></div>
  <section class="metrics">
    <div class="metric"><span>下游收入</span><strong id="revenue">--</strong></div>
    <div class="metric"><span>上游实扣</span><strong id="cost">--</strong></div>
    <div class="metric"><span>已对账毛利</span><strong id="profit">--</strong></div>
    <div class="metric"><span>已对账毛利率</span><strong id="margin">--</strong></div>
    <button class="metric filter-card" data-status="matched" title="筛选已取得A6逐笔账单、Subarx真实账单分摊，或接口未覆盖日期规则成本的下游调用"><span>已对账调用</span><strong id="matched">--</strong></button>
    <button class="metric filter-card" data-status="unmatched" title="筛选已有下游收入，但尚未确定上游成本的调用"><span>待对账调用</span><strong id="unmatched">--</strong></button>
    <button class="metric filter-card" data-status="upstream_unmatched" title="筛选已取得上游账单但未关联到下游调用的记录，以及Subarx真实账单差额"><span>上游待匹配</span><strong id="upstream-unmatched">--</strong></button>
    <button class="metric filter-card active" data-status="all" title="显示全部下游调用与上游未归属账单"><span>记录总数</span><strong id="record-total">--</strong></button>
  </section>
  <section class="chart-section" aria-label="经营趋势">
    <div class="chart-head"><div class="chart-title"><strong>经营趋势</strong><span id="chart-bucket">--</span></div><div class="chart-controls"><div class="segmented" aria-label="图表指标"><button class="active" data-chart-mode="money">金额</button><button data-chart-mode="count">调用量</button></div><div id="chart-legend" class="chart-legend"></div></div></div>
    <div class="chart-wrap"><canvas id="trend-chart" role="img" aria-label="筛选时间范围经营趋势折线图"></canvas><div id="chart-tooltip" class="chart-tooltip"></div></div>
  </section>
  <section class="rules-section" aria-label="上游账号规则">
    <div class="rules-head"><div><strong>当前分组渠道规则</strong> <span>按主站当前分组与渠道关系展示；同一分组可绑定多个上游渠道</span></div><span id="rules-status">--</span></div>
    <div class="rules-scroll"><table class="rules-table"><thead><tr><th>当前分组</th><th>渠道账号</th><th>最近模型</th><th class="num">范围内调用</th><th>上游类型</th><th>A6 令牌名 / Subarx 倍率</th><th>状态</th><th>操作</th></tr></thead><tbody id="rule-rows"></tbody></table></div>
  </section>
  <div class="table-wrap"><table><thead><tr><th>时间</th><th>用户邮箱</th><th>分组</th><th>模型</th><th class="num">输入 Token</th><th class="num">输出 Token</th><th class="num">缓存 Token</th><th class="num">下游收入</th><th class="num">上游实扣 CNY</th><th class="num">上游原币</th><th class="num">毛利</th><th>状态</th><th>Client Request ID</th><th>Upstream Request ID</th></tr></thead><tbody id="rows"></tbody></table></div>
  <div class="pager"><label>每页 <select id="page-size"><option>25</option><option selected>50</option><option>100</option></select></label><span id="page-info" class="pager-info">--</span><button id="prev" aria-label="上一页" title="上一页">‹</button><button id="next" aria-label="下一页" title="下一页">›</button></div>
</main>
<script>
const $=id=>document.getElementById(id);const state={page:1,pageSize:50,totalPages:0,loading:false,range:'24h',status:'all',chartMode:'money',chartData:null,chartGeometry:null};
function pad(n){return String(n).padStart(2,'0')}
function localInputValue(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`}
function setInputs(from,to){$('from').value=localInputValue(from);$('to').value=localInputValue(to);$('range-summary').textContent=`${from.toLocaleString()} 至 ${to.toLocaleString()}`}
function rangeDates(kind,now=new Date()){let from,to=new Date(now);switch(kind){case'today':from=new Date(now.getFullYear(),now.getMonth(),now.getDate());break;case'24h':from=new Date(now.getTime()-86400000);break;case'3d':from=new Date(now.getTime()-3*86400000);break;case'7d':from=new Date(now.getTime()-7*86400000);break;case'month':from=new Date(now.getFullYear(),now.getMonth(),1);break;case'last-month':from=new Date(now.getFullYear(),now.getMonth()-1,1);to=new Date(now.getFullYear(),now.getMonth(),1);break;case'3m':from=new Date(now);from.setMonth(from.getMonth()-3);break;case'1y':from=new Date(now);from.setFullYear(from.getFullYear()-1);break;default:throw new Error('未知时间范围')}return{from,to}}
function selectRange(kind,{reload=true}={}){state.range=kind;document.querySelectorAll('#quick-ranges button').forEach(b=>b.classList.toggle('active',b.dataset.range===kind));const {from,to}=rangeDates(kind);setInputs(from,to);state.page=1;if(reload)load()}
function timeQuery(){const from=new Date($('from').value),to=new Date($('to').value);if(Number.isNaN(from.getTime())||Number.isNaN(to.getTime()))throw new Error('请选择完整的开始和结束时间');if(from>=to)throw new Error('开始时间必须早于结束时间');$('range-summary').textContent=`${from.toLocaleString()} 至 ${to.toLocaleString()}`;return new URLSearchParams({from:from.toISOString(),to:to.toISOString()}).toString()}
function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}
function attr(v){return esc(v).replaceAll('"','&quot;').replaceAll("'",'&#39;')}
function cny(v){if(v===''||v==null)return'--';const raw=String(v);return raw.startsWith('-')?'-¥'+raw.slice(1):'¥'+raw}
function original(v,currency){if(v===''||v==null)return'--';if(currency==='USD')return'$'+v;if(currency==='CNY')return'¥'+v;return esc(currency||'')+' '+v}
function shortId(v){if(!v)return'--';return v.length>20?v.slice(0,10)+'…'+v.slice(-7):v}
function idButton(v){if(!v)return'--';return `<button class="id-button" data-copy="${attr(v)}" title="${attr(v)}">${esc(shortId(v))}</button>`}
function bindCopy(){document.querySelectorAll('.id-button').forEach(button=>button.addEventListener('click',async()=>{const originalText=button.textContent;try{await navigator.clipboard.writeText(button.dataset.copy);button.textContent='已复制';setTimeout(()=>button.textContent=originalText,900)}catch{button.title='复制失败，请悬停查看完整 ID'}}))}
function renderRows(items){$('rows').innerHTML=items.length?items.map(x=>{const orphan=x.record_type==='upstream_unmatched',unconfigured=x.cost_source==='rule_unconfigured',real=x.cost_source==='subarx_billed_allocation',gap=x.cost_source==='subarx_unallocated',pending=x.cost_source==='subarx_pending',a6pending=x.cost_source==='a6_pending',a6waiting=x.cost_source==='a6_waiting',waiting=x.cost_source==='subarx_waiting';const statusTitle=gap?'Subarx 真实账单中尚未归属于本站调用的费用':(orphan?'上游账单尚未关联到本站下游调用':(unconfigured?'该账号尚未登记上游类型与计费规则':(real?'Subarx 真实账单已按账号、业务日和模型完成对账':(pending?'Subarx 已返回该范围账单，但当前数据不足以可靠分配':(a6waiting?'A6 已建立上游请求映射，等待该请求的账单同步':(a6pending?'A6 规则已配置，但当前账单尚未与本站调用形成唯一匹配':(waiting?'该账号使用 Subarx API 真实账单，当前调用正在等待下一次账单同步':(x.cost_source==='subarx_rule'?'接口覆盖期外按历史倍率规则计算':(x.matched?'上游真实账单已关联':'规则已配置，尚未取得或匹配上游成本')))))))));const statusText=gap?'账单差额':(orphan?'上游待匹配':(unconfigured?'规则待配置':(real?'已对账':(pending?'账单待分配':(a6waiting?'等待账单':(a6pending?'上游待匹配':(waiting?'等待账单':(x.cost_source==='subarx_rule'?'规则实扣':(x.matched?'已对账':'待对账')))))))));const statusClass=orphan||unconfigured||gap||pending||a6pending||a6waiting||waiting?'orphan':(x.cost_source==='subarx_rule'?'rule':(x.matched?'ok':''));return `<tr><td>${new Date(x.created_at).toLocaleString()}</td><td><span class="truncate" title="${orphan?'无下游用户':'用户 #'+x.user_id+' · '+attr(x.user_email)}">${orphan?'--':esc(x.user_email||'#'+x.user_id)}</span></td><td><span class="truncate" title="${orphan?'无下游分组':attr(x.group_name)}">${orphan?'--':esc(x.group_name||'--')}</span></td><td>${esc(x.model)}</td><td class="num">${x.input_tokens}</td><td class="num">${x.output_tokens}</td><td class="num">${x.cache_tokens}</td><td class="num">${cny(x.revenue)}</td><td class="num">${cny(x.billed_upstream_cost)}</td><td class="num">${original(x.upstream_cost_original,x.upstream_currency)}</td><td class="num ${x.matched?(Number(x.gross_profit)>=0?'positive':'negative'):''}">${x.matched?cny(x.gross_profit):'--'}</td><td><span title="${statusTitle}" class="badge ${statusClass}">${statusText}</span></td><td>${idButton(x.request_id)}</td><td>${idButton(x.upstream_request_id)}</td></tr>`}).join(''):'<tr><td colspan="14" class="empty">暂无数据</td></tr>';bindCopy()}
function ruleParameter(item){return item.provider==='a6'?(item.token_name||''):(item.multiplier||'')}
function renderRules(data){$('rules-status').textContent=data.unconfigured_accounts?`有调用待配置 ${data.unconfigured_accounts} 个账号`:'当前调用账号均已配置';const counts=new Map;for(const item of data.items){const key=`${item.group_id}:${item.group_name}`;counts.set(key,(counts.get(key)||0)+1)}const rendered=new Set;$('rule-rows').innerHTML=data.items.length?data.items.map(item=>{const key=`${item.group_id}:${item.group_name}`,first=!rendered.has(key);rendered.add(key);const groupCell=first?`<td class="group-cell" rowspan="${counts.get(key)}"><strong>${esc(item.group_name||'未分组')}</strong><span>${item.group_id?'分组 #'+item.group_id:'未关联当前分组'} · ${counts.get(key)} 个渠道</span></td>`:'';const channelState=item.account_schedulable?'可调度':'已停用';const versionTitle=item.version?`规则版本 v${item.version}；修改只影响新采集调用，历史记录使用快照`:'尚无规则快照';return `<tr data-account="${item.account_id}">${groupCell}<td class="channel-cell"><strong>#${item.account_id} · ${esc(item.account_name||'未命名账号')}</strong><span class="channel-meta">${esc(item.account_platform||'--')} · ${esc(item.account_status||'--')} · ${channelState}</span></td><td><span class="truncate" title="${attr(item.models)}">${esc(item.models||'暂无调用记录')}</span></td><td class="num">${item.usage_count||0}</td><td><select class="rule-provider"><option value="" ${item.provider?'':'selected'}>请选择</option><option value="a6" ${item.provider==='a6'?'selected':''}>A6 API</option><option value="subarx" ${item.provider==='subarx'?'selected':''}>Subarx</option></select></td><td><input class="rule-value" value="${attr(ruleParameter(item))}" placeholder="选择类型后填写"></td><td><span class="badge ${item.configured?'ok':'orphan'}" title="${attr(versionTitle)}">${item.configured?'已配置':'待配置'}</span></td><td><button class="rule-save">保存</button>${item.provider?'<button class="rule-delete danger">删除</button>':''}</td></tr>`}).join(''):'<tr><td colspan="8" class="empty">主站当前没有可展示的渠道账号</td></tr>';bindRuleActions()}
function bindRuleActions(){document.querySelectorAll('#rule-rows tr[data-account]').forEach(row=>{const provider=row.querySelector('.rule-provider'),value=row.querySelector('.rule-value');const updatePlaceholder=()=>value.placeholder=provider.value==='a6'?'例如：2.0-kimik3':provider.value==='subarx'?'例如：0.1':'选择类型后填写';provider.onchange=updatePlaceholder;updatePlaceholder();row.querySelector('.rule-save').onclick=async()=>{if(!provider.value)return alert('请选择上游类型');const body={provider:provider.value};if(provider.value==='a6')body.token_name=value.value.trim();else body.multiplier=value.value.trim();const r=await fetch('/ops/api/account-rules/'+row.dataset.account,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json().catch(()=>({}));if(!r.ok)return alert(data.message||'保存失败');await load()};const del=row.querySelector('.rule-delete');if(del)del.onclick=async()=>{if(!confirm('删除后该账号的新调用会显示为规则待配置，历史已匹配账单不会被删除。确认继续？'))return;const r=await fetch('/ops/api/account-rules/'+row.dataset.account,{method:'DELETE'});if(!r.ok)return alert('删除失败');await load()}})}
const chartSeries={money:[{key:'revenue',label:'下游收入',color:'#1864ab'},{key:'upstream_cost',label:'上游实扣',color:'#d97706'},{key:'gross_profit',label:'已对账毛利',color:'#087f5b'}],count:[{key:'matched',label:'已对账',color:'#087f5b'},{key:'unmatched',label:'待对账',color:'#c92a2a'},{key:'upstream_unmatched',label:'上游待匹配',color:'#d97706'},{key:'record_total',label:'记录总数',color:'#1864ab'}]};
function chartNumber(v){const n=Number(v);return Number.isFinite(n)?n:0}
function chartValue(v){if(state.chartMode==='count')return Math.round(v).toLocaleString();if(v===0)return'¥0';const sign=v<0?'-':'',a=Math.abs(v),value=a>=100?a.toFixed(0):a>=1?a.toFixed(2):a>=.01?a.toFixed(4):a.toFixed(8);return sign+'¥'+value}
function renderChart(){const canvas=$('trend-chart'),wrap=canvas.parentElement,data=state.chartData;if(!data||!data.points?.length)return;const series=chartSeries[state.chartMode],width=wrap.clientWidth,height=wrap.clientHeight,dpr=Math.max(1,window.devicePixelRatio||1);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,width,height);const pad={left:64,right:18,top:14,bottom:34},plotW=Math.max(1,width-pad.left-pad.right),plotH=Math.max(1,height-pad.top-pad.bottom),values=data.points.flatMap(p=>series.map(s=>chartNumber(p[s.key])));let min=Math.min(0,...values),max=Math.max(0,...values);if(min===max)max=min+1;const span=max-min,x=i=>pad.left+(data.points.length===1?plotW/2:i*plotW/(data.points.length-1)),y=v=>pad.top+(max-v)*plotH/span;ctx.font='11px system-ui,"Microsoft YaHei",sans-serif';ctx.textBaseline='middle';ctx.strokeStyle='#e5e9ed';ctx.fillStyle='#66717e';ctx.lineWidth=1;for(let i=0;i<=4;i++){const yy=pad.top+i*plotH/4,value=max-i*span/4;ctx.beginPath();ctx.moveTo(pad.left,yy);ctx.lineTo(width-pad.right,yy);ctx.stroke();ctx.textAlign='right';ctx.fillText(state.chartMode==='money'?chartValue(value):Math.round(value).toLocaleString(),pad.left-8,yy)}const labelIndexes=[0,Math.round((data.points.length-1)/4),Math.round((data.points.length-1)/2),Math.round((data.points.length-1)*3/4),data.points.length-1].filter((v,i,a)=>a.indexOf(v)===i);ctx.textBaseline='top';for(const i of labelIndexes){const d=new Date(data.points[i].start),label=data.bucket==='1小时'||data.bucket==='6小时'?d.toLocaleString([],{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString();ctx.textAlign=i===0?'left':i===data.points.length-1?'right':'center';ctx.fillText(label,x(i),height-pad.bottom+9)}for(const s of series){ctx.strokeStyle=s.color;ctx.lineWidth=2;ctx.lineJoin='round';ctx.lineCap='round';ctx.beginPath();data.points.forEach((p,i)=>{const xx=x(i),yy=y(chartNumber(p[s.key]));i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)});ctx.stroke()}$('chart-legend').innerHTML=series.map(s=>`<span class="legend-item"><i class="legend-swatch" style="background:${s.color}"></i>${s.label}</span>`).join('');$('chart-bucket').textContent=`每 ${data.bucket} · ${data.points.length} 个点`;state.chartGeometry={x,pad,plotW,width,height,series}}
function showChartTooltip(event){const g=state.chartGeometry,data=state.chartData,tip=$('chart-tooltip');if(!g||!data?.points?.length)return;const rect=$('trend-chart').getBoundingClientRect(),mouseX=event.clientX-rect.left,index=Math.max(0,Math.min(data.points.length-1,Math.round((mouseX-g.pad.left)*(data.points.length-1)/g.plotW))),point=data.points[index],xx=g.x(index);tip.innerHTML=`<strong>${new Date(point.start).toLocaleString()}</strong>${g.series.map(s=>`<span style="color:${s.color}">${s.label}：${chartValue(chartNumber(point[s.key]))}</span>`).join('')}`;tip.style.display='block';const tipWidth=tip.offsetWidth;tip.style.left=Math.max(0,Math.min(g.width-tipWidth,xx-tipWidth/2))+'px';tip.style.top='10px'}
$('trend-chart').addEventListener('mousemove',showChartTooltip);$('trend-chart').addEventListener('mouseleave',()=>{$('chart-tooltip').style.display='none'});new ResizeObserver(()=>renderChart()).observe($('trend-chart').parentElement);
async function load({silent=false}={}){if(state.loading)return;state.loading=true;$('refresh').disabled=true;$('apply-range').disabled=true;try{const q=timeQuery();const [s,r,t,ar]=await Promise.all([fetch('/ops/api/summary?'+q),fetch(`/ops/api/requests?${q}&status=${state.status}&page=${state.page}&page_size=${state.pageSize}`),fetch('/ops/api/timeseries?'+q),fetch('/ops/api/account-rules?'+q)]);if(!s.ok||!r.ok||!t.ok||!ar.ok){const failed=[s,r,t,ar].find(x=>!x.ok),error=await failed.json().catch(()=>({}));throw new Error(error.message||'加载失败')}const summary=await s.json(),data=await r.json(),series=await t.json(),rules=await ar.json();state.totalPages=data.total_pages;state.chartData=series;$('revenue').textContent=cny(summary.revenue);$('cost').textContent=cny(summary.upstream_cost);$('profit').textContent=cny(summary.gross_profit);$('profit').className=Number(summary.gross_profit)>=0?'positive':'negative';$('margin').textContent=summary.margin_percent+'%';$('matched').textContent=summary.downstream_matched;$('unmatched').textContent=summary.downstream_unmatched;$('upstream-unmatched').textContent=summary.upstream_unmatched;$('record-total').textContent=summary.record_total;const fx=summary.fx_usd_cny?`USD/CNY ${summary.fx_usd_cny} · ${summary.fx_source}${summary.fx_stale?'（陈旧兜底）':''}`:'USD/CNY 尚无小时快照',gap=Number(summary.subarx_unallocated_cost)>0?` · Subarx差额 ${cny(summary.subarx_unallocated_cost)}`:'';$('fx-status').textContent=fx+gap;renderRows(data.items);renderRules(rules);renderChart();$('page-info').textContent=`第 ${data.page} / ${data.total_pages||1} 页 · 共 ${data.total} 条`;$('prev').disabled=data.page<=1;$('next').disabled=data.total_pages===0||data.page>=data.total_pages;$('updated').textContent='更新于 '+new Date().toLocaleTimeString()}catch(e){if(!silent)alert(e.message);$('updated').textContent='更新失败'}finally{state.loading=false;$('refresh').disabled=false;$('apply-range').disabled=false}}
$('refresh').onclick=()=>load();$('apply-range').onclick=()=>{state.range='custom';document.querySelectorAll('#quick-ranges button').forEach(b=>b.classList.remove('active'));state.page=1;load()};document.querySelectorAll('#quick-ranges button').forEach(b=>b.onclick=()=>selectRange(b.dataset.range));document.querySelectorAll('.filter-card').forEach(card=>card.onclick=()=>{state.status=card.dataset.status;state.page=1;document.querySelectorAll('.filter-card').forEach(c=>c.classList.toggle('active',c===card));load()});document.querySelectorAll('[data-chart-mode]').forEach(button=>button.onclick=()=>{state.chartMode=button.dataset.chartMode;document.querySelectorAll('[data-chart-mode]').forEach(b=>b.classList.toggle('active',b===button));renderChart()});$('collect').onclick=async()=>{const button=$('collect');button.disabled=true;const text=button.textContent;button.textContent='同步中';try{const r=await fetch('/ops/api/collect',{method:'POST'});if(!r.ok)throw new Error('同步失败');state.page=1;if(state.range!=='custom')selectRange(state.range,{reload:false});await load()}catch(e){alert(e.message)}finally{button.disabled=false;button.textContent=text}};$('page-size').onchange=()=>{state.pageSize=Number($('page-size').value);state.page=1;load()};$('prev').onclick=()=>{if(state.page>1){state.page--;load()}};$('next').onclick=()=>{if(state.page<state.totalPages){state.page++;load()}};setInterval(()=>{if($('auto-refresh').checked&&!document.hidden){if(state.range!=='custom')selectRange(state.range,{reload:false});load({silent:true})}},30000);selectRange('24h',{reload:false});load();
