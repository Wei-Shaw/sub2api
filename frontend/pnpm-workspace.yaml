allowBuilds:
  esbuild: true
  vue-demi: true

overrides:
  js-cookie: 3.0.7
  "form-data@<4.0.6": ">=4.0.6"
  postcss: 8.5.23
  brace-expansion: 5.0.8
  "js-yaml@>=4.0.0 <5.0.0": 4.3.0
  # GHSA-2v37-7h3g-55p8（high）：nanoid <3.3.17 在 size=0 时自定义生成器会死循环。
  # nanoid 是 postcss → @vue/compiler-sfc → vue 的传递依赖，改不到直接依赖，
  # 因此在这里提升。
  # 上界 <4.0.0 必须保留：postcss 声明的是 ^3.3.16，而 nanoid 4+ 是纯 ESM
  # （"type":"module"，无 CJS 入口），只写 ">=3.3.17" 会被解析到 6.x，
  # 在 Node 侧 require 时直接炸。
  "nanoid@<3.3.17": ">=3.3.17 <4.0.0"
