// ============================================================
// GatewayProviderExtension — plugin-provided, host-called
// ============================================================
//
// GatewayProviderExtension allows plugins to handle gateway request
// forwarding. The host calls Forward with the parsed request context;
// the plugin streams back response chunks (headers, body bytes, trailers)
// that the host pipes to the downstream HTTP client.
//
// This is the gRPC equivalent of the in-process GatewayProvider interface
// (backend/internal/gateway/provider.go). Phase 2+ plugins implement this
// service to handle upstream API forwarding for their platform.
//
// Failure model:
//   - Forward streams GatewayForwardChunk messages; the host writes each
//     chunk to the downstream http.ResponseWriter as it arrives.
//   - If the plugin returns a gRPC error before sending any chunk, the
//     host treats it as a forward failure and may failover to another
//     account (subject to ShouldFailover).
//   - If the plugin has already sent header/body chunks, the host sets
//     UpstreamAccepted=true and will NOT failover on subsequent errors.
//   - ShouldFailover is called synchronously after a forward failure;
//     plugins return true to indicate the error is transient and another
//     account should be tried.
service GatewayProviderExtension {
  // Forward handles a single gateway request. The plugin receives the full
  // request context (account credentials, model, body, headers) and streams
  // back the upstream response as chunked data.
  rpc Forward(GatewayForwardRequest) returns (stream GatewayForwardChunk);

  // ShouldFailover asks the plugin whether a failed forward should be
  // retried with a different account.
  rpc ShouldFailover(GatewayFailoverRequest) returns (GatewayFailoverResponse);
}

// GatewayForwardRequest carries the full request context for a gateway
// forward operation. It is the gRPC equivalent of gateway.ForwardRequest,
// minus the non-serializable fields (http.ResponseWriter, *gin.Context).
message GatewayForwardRequest {
  // --- request identity ---
  string request_id = 1;
  string model = 2;
  bool stream = 3;
  string protocol = 4;     // "anthropic" / "openai" / "gemini"

  // --- request body ---
  bytes raw_body = 5;

  // --- account info (the selected account to forward through) ---
  GatewayAccountInfo account = 6;

  // --- request metadata ---
  map<string, string> headers = 7;   // relevant upstream headers
  string method = 8;                 // HTTP method (GET/POST)
  string path = 9;                   // original request path

  // --- scheduling context ---
  int64 group_id = 10;               // 0 = no group constraint
  string session_hash = 11;
  string metadata_user_id = 12;
  int64 user_id = 13;
  int32 switch_count = 14;           // failover counter

  // --- platform-specific ---
  string gemini_action = 15;         // only when protocol == "gemini"
  bool is_sticky_session = 16;

  // --- client request context (added for god-object migration) ---

  // client_headers carries the downstream client's HTTP headers
  // (anthropic-beta, user-agent, content-type, x-api-key, etc.).
  // Plugins use these to forward or inspect client-originated headers
  // that are not part of the canonical upstream header set in `headers`.
  map<string, string> client_headers = 17;

  // --- scheduling / detection context ---

  // is_claude_code_client is true when the request originates from a
  // Claude Code CLI session (detected via user-agent + body heuristics).
  bool is_claude_code_client = 18;

  // thinking_enabled indicates whether extended thinking / chain-of-thought
  // is enabled for this request (parsed from the request body).
  bool thinking_enabled = 19;

  // prompt_cache_key is the OpenAI prompt cache key extracted from the
  // request body or headers, used for session affinity.
  string prompt_cache_key = 20;

  // channel_mapped_model is the model name after channel mapping has been
  // applied by the host pipeline. Empty when no mapping is active.
  string channel_mapped_model = 21;

  // --- billing context ---

  // force_cache_billing is set when a failover occurs after billing was
  // already consumed, forcing input_tokens to be billed as cache_read.
  bool force_cache_billing = 22;

  // --- image request context (OpenAI Images API) ---

  // images_request_json carries the JSON-encoded OpenAI Images request
  // metadata (endpoint, model, multipart data, capability). Only set
  // when protocol == "images".
  bytes images_request_json = 23;
}

// GatewayAccountInfo carries the account credentials and metadata the
// plugin needs to make upstream API calls. Sensitive fields (credentials)
// are passed as opaque JSON so each platform plugin can decode its own
// credential schema.
message GatewayAccountInfo {
  int64 account_id = 1;
  string platform = 2;
  string account_type = 3;
  bytes credentials_json = 4;   // JSON-encoded map[string]any
  bytes extra_json = 5;         // JSON-encoded map[string]any
  string name = 6;
  // proxy_url is the fully-qualified proxy URL (e.g. "socks5h://user:pass@host:port")
  // for this account's configured proxy. Empty when no proxy is assigned.
  string proxy_url = 7;
}

// GatewayForwardChunk is a single piece of the streamed response from the
// plugin back to the host. The host writes these to the downstream HTTP
// client in order. Exactly one of the chunk types is set per message.
message GatewayForwardChunk {
  oneof chunk {
    GatewayResponseHeaders headers = 1;
    GatewayResponseBody body = 2;
    GatewayResponseTrailers trailers = 3;
    GatewayResponseDone done = 4;
  }
}

// GatewayResponseHeaders is the first chunk sent by the plugin, carrying
// the HTTP response status and headers that the host should write to the
// downstream client before streaming body data.
message GatewayResponseHeaders {
  int32 status_code = 1;
  map<string, string> headers = 2;
}

// GatewayResponseBody carries a chunk of the response body. For SSE
// streams, each SSE event may be one or more body chunks.
message GatewayResponseBody {
  bytes data = 1;
}

// GatewayResponseTrailers carries optional HTTP trailers sent after the
// body is complete. Most APIs don't use trailers, but they are supported
// for completeness.
message GatewayResponseTrailers {
  map<string, string> trailers = 1;
}

// GatewayResponseDone signals the end of the forward stream. It carries
// the usage/timing data that the host needs for billing and logging.
message GatewayResponseDone {
  // result carries the usage data for billing; nil means no usage to record.
  GatewayForwardResult result = 1;
  // error is set when the forward failed after partial streaming. The host
  // logs it but cannot failover because upstream already accepted.
  string error = 2;
}

// GatewayForwardResult carries usage and timing data produced by the
// plugin's forward operation. This is the gRPC equivalent of
// gateway.ForwardResult.
message GatewayForwardResult {
  string request_id = 1;
  string model = 2;
  string upstream_model = 3;
  bool stream = 4;
  int64 duration_ms = 5;
  int32 first_token_ms = 6;  // 0 = not measured

  // Token counts
  int64 input_tokens = 10;
  int64 output_tokens = 11;
  int64 cache_creation_tokens = 12;
  int64 cache_read_tokens = 13;
  int64 image_output_tokens = 14;

  // Client behaviour
  bool client_disconnect = 20;

  // Image generation billing fields
  int32 image_count = 21;
  string image_size = 22;     // "1K" / "2K" / "4K"

  // upstream_error carries structured error information when the upstream
  // returned an error. Non-nil means the forward encountered an upstream
  // error; the host uses the structured fields to decide failover strategy
  // without parsing error strings.
  GatewayUpstreamError upstream_error = 30;

  // response_headers carries selected upstream HTTP response headers for
  // post-forward processing (e.g. Codex usage snapshot extraction via
  // x-codex-* headers). The plugin populates this with headers it deems
  // relevant; the host maps it to ForwardResult.ResponseHeaders.
  map<string, string> response_headers = 31;
}

// GatewayUpstreamError carries structured error information from the
// upstream API. This replaces string-based error signalling in
// GatewayResponseDone.error, giving the host enough detail to make
// failover decisions without parsing free-form error strings.
message GatewayUpstreamError {
  // status_code is the upstream HTTP response status code (e.g. 429, 503).
  int32 status_code = 1;

  // retry_on_same_account indicates a transient error (e.g. Google
  // intermittent 400, empty response) where retrying on the same account
  // may succeed. Maps to UpstreamFailoverError.RetryableOnSameAccount.
  bool retry_on_same_account = 2;

  // force_cache_billing signals that input tokens should be re-billed as
  // cache_read tokens (e.g. Antigravity sticky session account switch).
  // Maps to UpstreamFailoverError.ForceCacheBilling.
  bool force_cache_billing = 3;

  // error_type classifies the error for routing decisions:
  //   "rate_limit"   — upstream 429
  //   "overloaded"   — upstream 529 / 503
  //   "auth_error"   — upstream 401 / 403
  //   "server_error" — upstream 500 / 502 / 504
  //   "prompt_too_long" — input exceeded upstream limits
  //   ""             — unclassified
  string error_type = 4;

  // response_body is the raw upstream error response body (truncated to
  // a reasonable size by the plugin). Used by the host for error
  // passthrough rule matching.
  bytes response_body = 5;

  // response_headers carries selected upstream HTTP response headers from
  // the error response. The host maps these to
  // UpstreamFailoverError.ResponseHeaders for rate-limit reset time
  // calculation (x-codex-*, x-ratelimit-*, cf-ray, etc.) and diagnostic
  // header passthrough.
  map<string, string> response_headers = 6;
}

// GatewayFailoverRequest is sent to ShouldFailover after a forward failure.
// It carries the request context and the error that caused the failure so
// the plugin can decide whether to retry with another account.
message GatewayFailoverRequest {
  GatewayForwardRequest request = 1;
  string error_message = 2;
  string error_type = 3;   // Go type name of the error (e.g. "UpstreamFailoverError")
}

// GatewayFailoverResponse carries the plugin's decision on whether to
// retry the failed forward with a different account.
message GatewayFailoverResponse {
  bool should_failover = 1;
}

// ============================================================
// GatewayHostCallback — host-provided, plugin-called (reverse RPC)
// ============================================================
//
// GatewayHostCallback provides host capabilities that gateway plugins
// need during request forwarding. Unlike HostService (which provides
// business lookups), GatewayHostCallback is specific to the gateway
// forwarding lifecycle — token acquisition, error reporting, etc.
//
// The host registers this service on its gRPC server; the plugin SDK
// creates a GatewayHostCallbackClient from the same connection used
// for other core services (SQLProxy, RedisProxy, etc.).
//
// Availability model:
//   - Registered unconditionally when the host has gateway plugins.
//   - Plugins must treat RPC failures (Unimplemented from older hosts,
//     Unavailable during restart) as non-fatal and degrade gracefully.
service GatewayHostCallback {
  // GetAccessToken retrieves a fresh access token for the given account.
  // The host manages token refresh internally (OAuth refresh flow,
  // session key rotation, etc.); plugins call this instead of managing
  // their own token lifecycle.
  //
  // Returns the token and its type so the plugin can construct the
  // Authorization header. extra_headers carries any additional headers
  // the host needs added to upstream requests (e.g. anthropic-beta).
  rpc GetAccessToken(GetAccessTokenRequest) returns (GetAccessTokenResponse);

  // ReportOpsError reports an operational error to the host's ops error
  // logging infrastructure. Plugins call this when they encounter errors
  // that should appear in the admin ops dashboard but that the host
  // cannot observe directly (e.g. errors during plugin-managed upstream
  // communication).
  rpc ReportOpsError(ReportOpsErrorRequest) returns (ReportOpsErrorResponse);
}

message GetAccessTokenRequest {
  int64 account_id = 1;
}

message GetAccessTokenResponse {
  // access_token is the bearer token or API key to use.
  string access_token = 1;
  // token_type describes how to use the token: "bearer" means
  // Authorization: Bearer <token>; "api-key" means x-api-key: <token>.
  string token_type = 2;
  // extra_headers are additional headers the host requires on the upstream
  // request (e.g. anthropic-beta, x-org-id). The plugin should merge
  // these into its outgoing request headers.
  map<string, string> extra_headers = 3;
}

message ReportOpsErrorRequest {
  string request_id = 1;
  int64 account_id = 2;
  int32 status_code = 3;
  string error_message = 4;
  // error_type classifies the error for dashboard filtering:
  // "rate_limit", "overloaded", "auth_error", "server_error", etc.
  string error_type = 5;
}

message ReportOpsErrorResponse {}

// ============================================================
// ContentInterceptExtension — gateway request content interception
// ============================================================
//
// ContentInterceptExtension allows a plugin to inspect request content
// before the gateway forwards it upstream. The host calls Check() in
// the pipeline preflight stage, after account selection but before
// forwarding. The plugin evaluates the content against its moderation
// policy and returns an action (allow / block / observe).
//
// Operating modes (controlled by the plugin's internal config):
//   - off:       host never calls Check()
//   - observe:   host calls Check() asynchronously; never blocks requests
//   - pre_block: host calls Check() synchronously; blocks if action=BLOCK
//
// The host decides sync/async based on the mode reported by the plugin
// in its manifest or via a config query. The plugin itself is stateless
// with respect to mode — it always evaluates and returns a decision.
//
// Availability: probed lazily like other extensions. If the plugin does
// not implement this service, the host skips content interception.
service ContentInterceptExtension {
  // Check evaluates request content against the plugin's moderation policy.
  rpc Check(ContentCheckRequest) returns (ContentCheckResponse);
}

message ContentCheckRequest {
  string request_id = 1;

  // user context
  int64 user_id = 2;
  string user_email = 3;

  // api key context
  int64 api_key_id = 4;
  string api_key_name = 5;
  int64 group_id = 6;
  string group_name = 7;

  // request context
  string endpoint = 8;     // "/v1/messages", "/v1/chat/completions", etc.
  string protocol = 9;     // "anthropic", "openai", "gemini"
  string provider = 10;    // platform: "anthropic", "openai", "gemini", "antigravity"
  string model = 11;

  // raw request body for content extraction
  bytes body = 12;
}

message ContentCheckResponse {
  // action is the moderation decision.
  ContentAction action = 1;

  // blocked is true when the request should be rejected.
  bool blocked = 2;

  // flagged is true when the content was flagged (may be allowed in observe mode).
  bool flagged = 3;

  // status_code is the HTTP status to return when blocked (default 403).
  int32 status_code = 4;

  // message is the user-facing error message when blocked.
  string message = 5;

  // highest_category is the moderation category with the highest score.
  string highest_category = 6;

  // highest_score is the score of the highest category.
  double highest_score = 7;
}

enum ContentAction {
  CONTENT_ACTION_ALLOW = 0;
  CONTENT_ACTION_BLOCK = 1;
  CONTENT_ACTION_OBSERVE = 2;
}

